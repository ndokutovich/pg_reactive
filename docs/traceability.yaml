  notes: "Perf suite lives in tests/perf/; container Python tests map to integration, host .mjs tests to e2e. POSITIONING (honest): the live-query model re-runs the SELECT on every relevant write, so it is tuned for MANY READERS per query (dashboards, leaderboards, live aggregates) — NOT a high write-throughput firehose on subscribed tables. Published baselines (~222 TPS @1 sub, ~99 @10; fan-out clean @200, degrading @500; single-digit-ms e2e) are Docker-on-Windows DEV measurements — re-measure on native Linux/real hardware for production sizing (a Linux run is a follow-up; not done in the dev environment)."

