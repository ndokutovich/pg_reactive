FR-R.5:
  title: "Batch invalidation — defer recompute to pre-commit, one recompute per query per txn"
  status: implemented
  traces:
    - file: ext/src/invalidation.c
      symbol: pgr_xact_callback
      role: "Per-transaction dirty list flushed once at pre-commit (pg_reactive.batch_invalidation)"
  tests:
    unit:
      - file: ext/sql/09_batch_invalidation.sql
        symbol: "09_batch_invalidation"
      - file: ext/sql/16_recompute_role.sql
        symbol: "16_recompute_role"
    integration: []
    e2e: []
    security: []
  manual_check: ""
  notes: "16_recompute_role: the batch pre-commit recompute runs as the pgr-schema (extension) owner, not GetSessionUserId() — under the two-login-role proxy the session role is powerless, so a proxy-mediated write into a live-subscribed table got permission denied (SECURITY.md inv 22)."

