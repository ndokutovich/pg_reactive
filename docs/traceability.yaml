# pg_reactive / pgStack traceability matrix — spec → code → tests
#
# Schema: v2 (project-trace skill)
# Source-of-truth requirements:
#   docs/specs/pg_reactive_spec.md            → FR-R.*  (C extension + proxy + SDK core)
#   docs/specs/postgres_native_backend_spec.md → FR-B.*  (pgStack backend: auth/REST/RLS/storage/SDK)
# FR ids derive from the spec's §-section numbers (e.g. FR-R.2.1 = pg_reactive_spec §2.1).
# Created: 2026-06-14
#
# === gate config (read by scripts/check-traceability.py) ===
# fr_pattern:     ^(FR-[A-Za-z0-9_.]+):$
# status_ranks:   implemented:3,partial:2,not_implemented:1
# test_buckets:   unit,integration,e2e,security
# spec_sources:   docs/specs/pg_reactive_spec.md=FR-R, docs/specs/postgres_native_backend_spec.md=FR-B
# spec_skip:      FR-R.1, FR-R.13, FR-R.15, FR-R.16, FR-B.1, FR-B.2, FR-B.10
#
# === conventions ===
# - status: implemented (traces + >=1 test bucket) · partial (traces, no test) · not_implemented (no traces)
# - test buckets: unit = pg_regress(ext/sql) + Go *_test.go + vitest; integration = isolation .spec + tests/integration/*.py;
#   e2e = tests/e2e_*.mjs; security = tests/security/*.test.mjs. (perf suite tests/perf/ maps into integration (Python) + e2e (.mjs) under FR-R.14.)
# - Rename rule: if an FR id changes, add `_renamed: <old-id>` and refresh the baseline.

