services:
  db:
    build:
      context: ..
      dockerfile: examples/Dockerfile.examples
    environment:
      POSTGRES_DB: pg_reactive_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${PG_PORT:-15432}:5432"
    command: >
      postgres
        -c shared_preload_libraries=pg_reactive
        -c log_min_messages=warning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_reactive_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Go proxy (compiles in ~30s — use this instead of 'proxy' for faster builds)
  proxy:
    build:
      context: ..
      dockerfile: proxy-go/Dockerfile
      args:
        DOCS_BASE_URL: /pg-reactive/docs/
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pg_reactive_test
      LISTEN_ADDR: "0.0.0.0:8080"
      ENABLE_SQL_ENDPOINT: "true"
      JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-dev-only-service-role-key-do-not-use-in-production}
      ANON_KEY: ${ANON_KEY:-anon-key-12345}
    ports:
      - "${PROXY_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

#  # Rust proxy (slow to build — kept for reference)
#  proxy-rust:
#    build:
#      context: ..
#      dockerfile: proxy/Dockerfile
#    environment:
#      DATABASE_URL: postgres://postgres:postgres@db:5432/pg_reactive_test
#      LISTEN_ADDR: "0.0.0.0:8080"
#      RUST_LOG: pg_reactive_proxy=info
#    ports:
#      - "8082:8080"
#    depends_on:
#      db:
#        condition: service_healthy

  # Reference polyglot edge function (runtime="http"). A separate container
  # in any language — registered in pgstack.edge_functions by setup.sql and
  # reverse-proxied to by the Go proxy. See examples/functions/README.md.
  hello-go:
    build:
      context: ./functions/hello-go
    environment:
      LISTEN_ADDR: ":9100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Shares the default network with db + proxy — reachable as
    # http://hello-go:9100, which is the upstream_url in functions/setup.sql.

  setup:
    build:
      context: ..
      dockerfile: examples/Dockerfile.examples
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: pg_reactive_test
    depends_on:
      db:
        condition: service_healthy
      # Register the http function only once its container is up, so the
      # first call doesn't 502 while hello-go is still starting.
      hello-go:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo "Initializing examples..."
        for f in /examples/*/setup.sql /examples/apps/*/setup.sql; do
          [ -f "$$f" ] || continue
          echo "  Running $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "All examples initialized!"

  web:
    build:
      context: ..
      dockerfile: examples/Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      default:
      gateway:
        aliases:
          - pgr-web
          # Umbrella nginx (vps-12gb-pgstack/app-reactive.conf) targets
          # http://pgr-stack:8080 — the hostname of the old monolithic
          # deploy. This service now plays that role (static landing +
          # reverse-proxy to the Go proxy), so own the alias here in the
          # base file rather than relying on a prod-override merge.
          - pgr-stack

volumes:
  pgdata:

networks:
  gateway:
    external: true
