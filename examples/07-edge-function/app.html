<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>07 — Edge Function</title>
<link rel="icon" href="../favicon.svg">
<script src="../config.js"></script>
<script src="../_lib/pgstack.js"></script>
<style>
  body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:24px; max-width:760px; margin-inline:auto; }
  h1 { margin:0 0 4px; color:#58a6ff; }
  .sub { color:#8b949e; margin-bottom:24px; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; margin-bottom:16px; }
  pre { background:#0d1117; border:1px solid #21262d; border-radius:6px; padding:12px; overflow-x:auto; font-size:12px; font-family:ui-monospace,Consolas,monospace; margin:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid #30363d; background:#0d1117; color:inherit; flex:1; min-width:200px; }
  button { background:#238636; color:#fff; border:0; border-radius:6px; padding:8px 16px; font:inherit; cursor:pointer; }
  label { font-size:13px; color:#8b949e; }
  code { background:#21262d; padding:2px 6px; border-radius:4px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .who { color:#3fb950; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
</style>
</head>
<body>
<h1>07 — Edge Function</h1>
<p class="sub">
  Invokes the <code>hello-go</code> edge function. Function lives in a
  separate container; pgStack proxy injects your identity as
  <code>X-Pgstack-Role</code> / <code>-Sub</code> / <code>-Claims</code>
  headers. Function code is in <code>examples/functions/hello-go/</code>.
</p>

<div class="panel">
  <div>Identity: <span id="who" class="who">…</span></div>
  <div class="row" style="margin-top:12px">
    <label><input type="checkbox" id="authToggle" /> sign in (use JWT instead of anon)</label>
  </div>
</div>

<div class="panel">
  <div class="row">
    <input id="message" placeholder="say something to the function…" value="hello from the browser" />
    <button id="invoke">Invoke</button>
  </div>
</div>

<div class="panel">
  <div class="row" style="justify-content:space-between; margin-bottom:8px">
    <strong>Response</strong>
    <span id="status" class="who"></span>
  </div>
  <pre id="response">awaiting first call…</pre>
</div>

<script>
const pg = new PgStack();
const who = document.getElementById('who');
const authToggle = document.getElementById('authToggle');

function updateWho() {
  who.textContent = pg.token ? ('JWT — ' + pg.user.id) : 'anon (no JWT)';
}

authToggle.onchange = async () => {
  if (authToggle.checked) {
    await pg.autoAuth();
  } else {
    pg.signOut();
    try { sessionStorage.removeItem('pgr_session_creds'); } catch {}
  }
  updateWho();
};

updateWho();

document.getElementById('invoke').onclick = async () => {
  const message = document.getElementById('message').value;
  const start = performance.now();
  try {
    const data = await pg.invoke('hello-go', { message });
    const ms = (performance.now() - start).toFixed(0);
    document.getElementById('status').textContent = `200 OK · ${ms}ms`;
    document.getElementById('response').textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    document.getElementById('status').textContent = 'error';
    document.getElementById('response').textContent = e.message;
  }
};
</script>
</body>
</html>
