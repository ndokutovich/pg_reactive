<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses — pgStack</title>
<link rel="icon" href="../../favicon.svg">
<script src="../../config.js"></script>
<script src="../../_lib/pgstack.js"></script>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#c9d1d9;
    --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
  }
  * { box-sizing: border-box; }
  body { font: 15px -apple-system, BlinkMacSystemFont, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:24px; max-width:760px; margin-inline:auto; }
  h1 { margin:0 0 4px; color:var(--accent); }
  .sub { color:var(--muted); margin-bottom:16px; font-size:13px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .who { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--green); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, select, button { font:inherit; padding:9px 12px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:inherit; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; font-weight:500; }
  button:hover { filter:brightness(1.1); }
  button.warn { background:transparent; color:var(--red); padding:4px 8px; }
  .totals { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; }
  .total-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; }
  .total-card .cat { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .total-card .amt { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:4px; }
  .total-card .items { font-size:11px; color:var(--muted); margin-top:2px; }
  .exp { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #21262d; }
  .exp:last-child { border-bottom:0; }
  .exp .amt { font-variant-numeric:tabular-nums; font-weight:500; min-width:80px; text-align:right; }
  .exp .cat { font-size:11px; padding:2px 6px; border-radius:4px; background:#21262d; color:var(--muted); }
  .exp .desc { flex:1; color:var(--text); }
  .exp .date { font-size:11px; color:var(--muted); font-family:ui-monospace,Consolas,monospace; }
  .empty { text-align:center; padding:40px 12px; color:var(--muted); }
  code { background:#21262d; padding:2px 6px; border-radius:4px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  h2 { margin:0 0 10px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
</style>
</head>
<body>
<h1>Expenses</h1>
<p class="sub">Two live subscriptions bound to the same user: a list of recent expenses AND a per-category running total for this month. Both refresh the moment you add a row.</p>

<div class="panel"><div>Signed in as <span id="who" class="who">…</span></div></div>

<div class="panel">
  <div class="row">
    <input id="amount" type="number" step="0.01" placeholder="Amount" style="width:120px" />
    <select id="cat">
      <option>food</option><option>transport</option><option>rent</option>
      <option>utilities</option><option>entertainment</option><option>other</option>
    </select>
    <input id="desc" placeholder="Description (optional)" style="flex:1; min-width:160px" />
    <button id="add">Add</button>
  </div>
</div>

<div class="panel">
  <h2>This month</h2>
  <div id="totals" class="totals"></div>
</div>

<div class="panel">
  <h2>Recent</h2>
  <div id="list"><div class="empty">No expenses yet.</div></div>
</div>

<script>
const pg = new PgStack();
const totalsEl = document.getElementById('totals');
const listEl   = document.getElementById('list');
const items  = new Map();
const totals = new Map();

function fmt(amt) { return '$' + Number(amt).toFixed(2); }
function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

function renderItems() {
  while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
  if (items.size === 0) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No expenses yet.';
    listEl.appendChild(e);
    return;
  }
  const sorted = [...items.values()]
    .sort((a, b) => (b.spent_at.localeCompare(a.spent_at)) || (b.id - a.id))
    .slice(0, 50);
  for (const e of sorted) {
    const row = document.createElement('div'); row.className = 'exp';

    const amt = document.createElement('span'); amt.className = 'amt'; amt.textContent = fmt(e.amount); row.appendChild(amt);
    const cat = document.createElement('span'); cat.className = 'cat'; cat.textContent = e.category;   row.appendChild(cat);
    const desc = document.createElement('span'); desc.className = 'desc'; desc.textContent = e.description || ''; row.appendChild(desc);
    const date = document.createElement('span'); date.className = 'date'; date.textContent = fmtDate(e.spent_at); row.appendChild(date);

    const del = document.createElement('button'); del.className = 'warn'; del.textContent = '×';
    del.onclick = () => remove(e); row.appendChild(del);

    listEl.appendChild(row);
  }
}

function renderTotals() {
  while (totalsEl.firstChild) totalsEl.removeChild(totalsEl.firstChild);
  if (totals.size === 0) {
    const e = document.createElement('div');
    e.style.color = 'var(--muted)'; e.style.fontSize = '13px';
    e.textContent = 'no expenses yet this month';
    totalsEl.appendChild(e); return;
  }
  const sorted = [...totals.values()].sort((a, b) => b.total - a.total);
  for (const t of sorted) {
    const card = document.createElement('div'); card.className = 'total-card';
    const c = document.createElement('div'); c.className = 'cat'; c.textContent = t.category;
    const a = document.createElement('div'); a.className = 'amt'; a.textContent = fmt(t.total);
    const i = document.createElement('div'); i.className = 'items'; i.textContent = t.items + ' item' + (t.items === 1 ? '' : 's');
    card.appendChild(c); card.appendChild(a); card.appendChild(i);
    totalsEl.appendChild(card);
  }
}

async function add() {
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('cat').value;
  const description = document.getElementById('desc').value.trim() || null;
  if (!amount || amount <= 0) return;
  await pg.rest('/expenses', {
    method: 'POST',
    body: JSON.stringify({ user_id: pg.user.id, amount, category, description })
  });
  document.getElementById('amount').value = '';
  document.getElementById('desc').value = '';
}

async function remove(e) {
  await pg.rest('/expenses?id=eq.' + e.id, { method: 'DELETE' });
}

document.getElementById('add').onclick = add;
document.getElementById('desc').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

async function boot() {
  const user = await pg.autoAuth();
  document.getElementById('who').textContent = user.id;
  const sub = await pg.rest('/rpc/subscribe_my_expenses', { method: 'POST', body: '{}' });

  pg.liveQuery(sub.items, {
    onSnapshot(rows) { for (const r of rows) items.set(r.id, r); renderItems(); },
    onDelta(ins, del) {
      for (const r of del) items.delete(r.id);
      for (const r of ins) items.set(r.id, r);
      renderItems();
    }
  });

  pg.liveQuery(sub.totals, {
    onSnapshot(rows) { for (const r of rows) totals.set(r.category, r); renderTotals(); },
    onDelta(ins, del) {
      for (const r of del) totals.delete(r.category);
      for (const r of ins) totals.set(r.category, r);
      renderTotals();
    }
  });
}
boot().catch(e => { document.getElementById('who').textContent = 'auth failed: ' + e.message; });
</script>
</body>
</html>
