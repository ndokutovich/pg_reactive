<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todos — pgStack</title>
<link rel="icon" href="../../favicon.svg">
<script src="../../config.js"></script>
<script src="../../_lib/pgstack.js"></script>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#c9d1d9;
    --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --orange:#d29922;
  }
  * { box-sizing: border-box; }
  body { font: 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); margin:0; padding:24px; max-width:640px; margin-inline:auto; }
  h1 { margin:0 0 4px; color:var(--accent); }
  .sub { color:var(--muted); margin-bottom:16px; font-size:13px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .who { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--green); }
  .row { display:flex; gap:8px; align-items:center; }
  input, select, button { font:inherit; padding:9px 12px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:inherit; }
  input { flex:1; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; font-weight:500; }
  button:hover { filter:brightness(1.1); }
  button.warn { background:transparent; color:var(--red); padding:4px 8px; }
  .todo { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #21262d; }
  .todo:last-child { border-bottom:0; }
  .todo input[type=checkbox] { width:18px; height:18px; cursor:pointer; }
  .todo.done .text { text-decoration:line-through; color:var(--muted); }
  .todo .text { flex:1; }
  .todo .pri { font-size:11px; padding:2px 6px; border-radius:4px; }
  .pri-0 { background:#21262d; color:var(--muted); }
  .pri-1 { background:#1f6feb22; color:var(--accent); }
  .pri-2 { background:#d2992233; color:var(--orange); }
  .due { font-size:11px; color:var(--muted); font-family:ui-monospace,Consolas,monospace; }
  .empty { text-align:center; padding:40px 12px; color:var(--muted); }
  code { background:#21262d; padding:2px 6px; border-radius:4px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
</style>
</head>
<body>
<h1>Todos</h1>
<p class="sub">Per-user task tracker. Each account gets its own audience-bound live query (<code>todos_&lt;uuid&gt;</code>); RLS ensures even REST queries can only see your rows.</p>

<div class="panel">
  <div>Signed in as <span id="who" class="who">…</span></div>
</div>

<div class="panel">
  <div class="row">
    <input id="text" placeholder="What needs doing?" />
    <select id="pri">
      <option value="0">Low</option>
      <option value="1" selected>Normal</option>
      <option value="2">High</option>
    </select>
    <button id="add">Add</button>
  </div>
</div>

<div class="panel">
  <div id="list">
    <div class="empty">No todos yet — add one above.</div>
  </div>
</div>

<script>
const pg = new PgStack();
const list = document.getElementById('list');
const items = new Map();
let liveSub = null;

function priLabel(p) { return p === 2 ? 'high' : p === 0 ? 'low' : 'normal'; }
function fmtDue(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function render() {
  while (list.firstChild) list.removeChild(list.firstChild);
  if (items.size === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No todos yet — add one above.';
    list.appendChild(empty);
    return;
  }
  const sorted = [...items.values()]
    .sort((a, b) => (a.done - b.done) || (b.priority - a.priority) || b.created_at.localeCompare(a.created_at));
  for (const t of sorted) {
    const row = document.createElement('div');
    row.className = 'todo' + (t.done ? ' done' : '');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.done;
    cb.onchange = () => toggle(t);
    row.appendChild(cb);

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = t.text;
    row.appendChild(text);

    if (t.due_at) {
      const due = document.createElement('span');
      due.className = 'due';
      due.textContent = fmtDue(t.due_at);
      row.appendChild(due);
    }

    const pri = document.createElement('span');
    pri.className = 'pri pri-' + t.priority;
    pri.textContent = priLabel(t.priority);
    row.appendChild(pri);

    const del = document.createElement('button');
    del.className = 'warn';
    del.textContent = '×';
    del.onclick = () => remove(t);
    row.appendChild(del);

    list.appendChild(row);
  }
}

async function add() {
  const text = document.getElementById('text').value.trim();
  const priority = parseInt(document.getElementById('pri').value, 10);
  if (!text) return;
  await pg.rest('/todos', {
    method: 'POST',
    body: JSON.stringify({ user_id: pg.user.id, text, priority })
  });
  document.getElementById('text').value = '';
}

async function toggle(t) {
  await pg.rest('/todos?id=eq.' + t.id, {
    method: 'PATCH',
    body: JSON.stringify({ done: !t.done, updated_at: new Date().toISOString() })
  });
}

async function remove(t) {
  await pg.rest('/todos?id=eq.' + t.id, { method: 'DELETE' });
}

document.getElementById('add').onclick = add;
document.getElementById('text').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

async function boot() {
  const user = await pg.autoAuth();
  document.getElementById('who').textContent = user.id;
  const qid = await pg.rest('/rpc/subscribe_my_todos', { method: 'POST', body: '{}' });
  liveSub = pg.liveQuery(qid, {
    onSnapshot(rows) { for (const r of rows) items.set(r.id, r); render(); },
    onDelta(ins, del) {
      for (const r of del) items.delete(r.id);
      for (const r of ins) items.set(r.id, r);
      render();
    }
  });
}
boot().catch(e => { document.getElementById('who').textContent = 'auth failed: ' + e.message; });
</script>
</body>
</html>
