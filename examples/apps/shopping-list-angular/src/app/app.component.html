<app-toast></app-toast>

@switch (screen()) {
  @case ('setup') {
    <app-setup-screen
      (skip)="screen.set('auth')"
      (done)="screen.set('auth')">
    </app-setup-screen>
  }
  @case ('auth') {
    <app-auth-screen
      (authenticated)="onAuthenticated()">
    </app-auth-screen>
  }
  @case ('lists') {
    <app-lists-screen
      (openList)="onOpenList($event)"
      (loggedOut)="onLoggedOut()">
    </app-lists-screen>
  }
  @case ('detail') {
    @if (currentList()) {
      <app-detail-screen
        [list]="currentList()"
        (back)="onBackToLists()">
      </app-detail-screen>
    }
  }
}
