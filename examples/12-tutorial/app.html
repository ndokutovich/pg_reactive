<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pg_reactive Interactive Tutorial</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --text-bright: #f0f6fc; --muted: #8b949e;
    --accent: #58a6ff; --green: #3fb950; --red: #f85149;
    --yellow: #d29922; --purple: #bc8cff;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header { padding: 20px 32px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header .title-area h1 { font-size: 20px; color: var(--text-bright); font-weight: 600; }
  header .title-area h1 em { font-style: normal; color: var(--accent); }
  header .title-area p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  header .header-actions { display: flex; align-items: center; gap: 12px; }
  .toggle-btn { background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
  .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Progress Stepper */
  .stepper { padding: 16px 24px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .stepper-track { display: flex; align-items: center; min-width: max-content; margin: 0 auto; max-width: 900px; }
  .stepper-line { flex: 1; height: 2px; background: var(--border); min-width: 8px; transition: background 0.3s; }
  .stepper-line.done { background: var(--accent); }
  .stepper-node { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg); color: var(--muted); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; flex-shrink: 0; font-family: var(--font); }
  .stepper-node:hover { border-color: var(--accent); color: var(--accent); }
  .stepper-node.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .stepper-node.current { background: var(--accent); border-color: var(--accent); color: var(--bg); box-shadow: 0 0 10px rgba(88,166,255,0.4); }
  .stepper-chapters { display: flex; justify-content: space-between; max-width: 900px; margin: 8px auto 0; padding: 0 14px; }
  .stepper-chapter { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .stepper-compact { display: none; font-size: 13px; color: var(--muted); text-align: center; padding: 4px 0; }

  /* Content area */
  .content { flex: 1; overflow-y: auto; padding: 24px 24px 80px; }
  .step-wrap { max-width: 900px; margin: 0 auto; }
  .step-card { display: none; animation: stepIn 0.35s ease-out; }
  .step-card.active { display: block; }

  /* Show All mode */
  .all-mode .step-card { display: block; margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid var(--border); }
  .all-mode .step-card:last-child { border-bottom: none; }
  .all-mode .chapter-divider { display: block; }

  .chapter-divider { display: none; padding: 12px 0; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
  .chapter-divider span { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

  /* Step header */
  .step-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
  .step-num { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; color: var(--bg); }
  .step-meta h2 { font-size: 20px; font-weight: 600; color: var(--text-bright); line-height: 1.3; }
  .step-badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-subscribe { background: #58a6ff22; color: var(--accent); }
  .badge-dml { background: #3fb95022; color: var(--green); }
  .badge-join { background: #bc8cff22; color: var(--purple); }
  .badge-agg { background: #d2992222; color: var(--yellow); }
  .badge-window { background: #f8514922; color: var(--red); }
  .badge-notify { background: #d2992222; color: var(--yellow); }
  .badge-admin { background: #8b949e22; color: var(--muted); }

  /* Explanation card */
  .explain-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 16px 20px; margin-bottom: 20px; font-size: 14px; line-height: 1.7; }
  .explain-card code { background: rgba(88,166,255,0.1); color: var(--accent); padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }

  /* SQL code block */
  .sql-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .sql-head { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
  .sql-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(88,166,255,0.12); color: var(--accent); flex-shrink: 0; }
  .sql-label { font-size: 12px; color: var(--muted); flex: 1; }
  .copy-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-family: var(--font); flex-shrink: 0; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); }
  .sql-body { padding: 16px 20px; background: var(--bg); font-family: var(--mono); font-size: 13px; line-height: 1.7; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .sk { color: #ff7b72; }       /* keyword */
  .sf { color: #d2a8ff; }       /* function */
  .ss { color: #a5d6ff; }       /* string */
  .sn { color: #79c0ff; }       /* number */
  .sc { color: #8b949e; }       /* comment */
  .so { color: #c9d1d9; }       /* operator/default */

  /* Result table */
  .result-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .result-head { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
  .result-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(63,185,80,0.12); color: var(--green); }
  .result-label { font-size: 12px; color: var(--muted); flex: 1; }
  .result-table { width: 100%; border-collapse: collapse; }
  .result-table thead th { text-align: left; padding: 10px 14px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; font-family: var(--mono); white-space: nowrap; }
  .result-table tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .result-table tbody tr:last-child td { border-bottom: none; }
  .result-table tbody tr:hover td { background: #1c2128; }
  .result-footer { padding: 8px 14px; font-size: 12px; color: var(--muted); text-align: right; font-style: italic; border-top: 1px solid var(--border); }

  /* JSON viewer */
  .json-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .json-panel.json-delta { border-left: 3px solid var(--green); }
  .json-panel.json-notify { border-left: 3px solid var(--yellow); }
  .json-head { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
  .json-type-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .json-type-delta { background: rgba(63,185,80,0.12); color: var(--green); }
  .json-type-notify { background: rgba(210,153,34,0.12); color: var(--yellow); }
  .json-label { font-size: 12px; color: var(--muted); flex: 1; }
  .json-body { padding: 16px 20px; background: var(--bg); font-family: var(--mono); font-size: 13px; line-height: 1.7; overflow-x: auto; }
  .jk { color: #58a6ff; }       /* key */
  .js { color: #a5d6ff; }       /* string value */
  .jn { color: #79c0ff; }       /* number */
  .jb { color: #8b949e; }       /* brace/bracket */
  .jp { color: #6e7681; }       /* punctuation (comma, colon) */
  .jl { color: #ff7b72; }       /* boolean/null */

  /* Info callout */
  .info-card { background: rgba(88,166,255,0.04); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 16px 20px; margin-bottom: 16px; }
  .info-card .info-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
  .info-card ol { padding-left: 20px; }
  .info-card li { font-size: 13px; line-height: 1.6; margin-bottom: 4px; color: var(--text); }
  .info-card li code { background: rgba(88,166,255,0.1); color: var(--accent); padding: 1px 5px; border-radius: 3px; font-family: var(--mono); font-size: 12px; }
  .info-card .info-plain { font-size: 13px; line-height: 1.6; }
  .info-card .info-plain code { background: rgba(88,166,255,0.1); color: var(--accent); padding: 1px 5px; border-radius: 3px; font-family: var(--mono); font-size: 12px; }

  /* Flow diagram */
  .flow-diagram { display: flex; align-items: center; padding: 16px 0; margin-bottom: 16px; overflow-x: auto; }
  .flow-node { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; white-space: nowrap; color: var(--muted); flex-shrink: 0; transition: all 0.3s; }
  .flow-node.flow-active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }
  .flow-arrow { width: 24px; height: 0; border-top: 2px solid var(--border); position: relative; flex-shrink: 0; }
  .flow-arrow::after { content: ''; position: absolute; right: -1px; top: -5px; border: 5px solid transparent; border-left-color: var(--border); }

  /* Feature comparison table */
  .feat-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .feat-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--text-bright); }
  .feat-scroll { overflow-x: auto; }
  .feat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .feat-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .feat-table th.col-pgr { color: var(--accent); }
  .feat-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .feat-table tbody tr:hover td { background: #1c2128; }
  .feat-yes { color: var(--green); font-weight: 600; }
  .feat-no { color: var(--red); }
  .feat-na { color: var(--muted); }
  .feat-step { color: var(--accent); cursor: pointer; }
  .feat-step:hover { text-decoration: underline; }

  /* Fixed bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
  .bottom-nav .nav-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; font-family: var(--font); min-width: 90px; }
  .bottom-nav .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .bottom-nav .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .bottom-nav .nav-center { font-size: 13px; color: var(--muted); text-align: center; }
  .all-mode .bottom-nav { display: none; }
  .all-mode .content { padding-bottom: 24px; }

  /* Animations */
  @keyframes stepIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Responsive */
  @media (max-width: 700px) {
    header { padding: 16px; }
    .stepper-track, .stepper-chapters { display: none; }
    .stepper-compact { display: block; }
    .step-badges { display: none; }
    .flow-diagram { flex-direction: column; gap: 4px; align-items: stretch; }
    .flow-node { text-align: center; }
    .flow-arrow { width: 0; height: 16px; border-top: none; border-left: 2px solid var(--border); margin: 0 auto; }
    .flow-arrow::after { right: auto; left: -5px; top: auto; bottom: -1px; border: 5px solid transparent; border-top-color: var(--border); border-left-color: transparent; }
    .feat-scroll { -webkit-overflow-scrolling: touch; }
    .content { padding: 16px 16px 72px; }
  }

</style>
<script src="../config.js"></script>
</head>
<body>

<header>
  <div class="title-area">
    <h1><em>pg_reactive</em> Interactive Tutorial</h1>
    <p>15-step walkthrough of every feature with SQL examples and expected output</p>
  </div>
  <div class="header-actions">
    <button class="toggle-btn" id="viewToggle">Show All</button>
  </div>
</header>

<div class="stepper" id="stepperArea">
  <div class="stepper-track" id="stepperTrack"></div>
  <div class="stepper-chapters" id="stepperChapters"></div>
  <div class="stepper-compact" id="stepperCompact"></div>
</div>

<div class="content" id="contentArea">
  <div class="step-wrap" id="stepWrap"></div>
</div>

<div class="bottom-nav" id="bottomNav">
  <button class="nav-btn" id="prevBtn">&larr; Prev</button>
  <div class="nav-center" id="navCenter"></div>
  <button class="nav-btn" id="nextBtn">Next &rarr;</button>
</div>

<script>
/* ── Chapter definitions ── */
var CHAPTERS = [
  { title: 'Getting Started', color: 'var(--muted)', steps: [0, 1] },
  { title: 'Basic DML', color: 'var(--green)', steps: [2, 3, 4, 5] },
  { title: 'Advanced Queries', color: 'var(--purple)', steps: [6, 7, 8, 9] },
  { title: 'Notify Mode', color: 'var(--yellow)', steps: [10, 11] },
  { title: 'Administration', color: 'var(--accent)', steps: [12, 13, 14] }
];

function chapterOf(idx) {
  for (var i = 0; i < CHAPTERS.length; i++) {
    if (CHAPTERS[i].steps.indexOf(idx) !== -1) return i;
  }
  return 0;
}
function chapterColor(idx) { return CHAPTERS[chapterOf(idx)].color; }

/* ── Badge config ── */
var BADGE_CLS = {
  subscribe: 'badge-subscribe', dml: 'badge-dml', join: 'badge-join',
  agg: 'badge-agg', window: 'badge-window', notify: 'badge-notify', admin: 'badge-admin'
};

/* ── Step data ── */
var STEPS = [
  /* 0 */ {
    title: 'Connect to PostgreSQL',
    badges: ['admin'],
    explain: 'Open a `psql` session inside the running Docker container. This gives you a live connection to the pg_reactive-enabled database.',
    blocks: [
      { type: 'sql', label: 'Terminal command',
        copyText: 'docker compose exec db psql -U postgres -d pg_reactive_test',
        sql: '# From your host machine:\ndocker compose exec db psql -U postgres -d pg_reactive_test' },
      { type: 'info', title: 'Expected output', items: [
        'psql (16.x)',
        'Type "help" for help.',
        '`pg_reactive_test=#` prompt appears'
      ]}
    ]
  },
  /* 1 */ {
    title: 'Verify Extension Is Loaded',
    badges: ['admin'],
    explain: '`pg_reactive` loads via `shared_preload_libraries` at server start. The `pgr` schema contains all functions. Confirm it is available.',
    blocks: [
      { type: 'sql', label: 'Check extension',
        copyText: "SELECT extname, extversion FROM pg_extension WHERE extname = 'pg_reactive';",
        sql: "SELECT extname, extversion\nFROM pg_extension\nWHERE extname = 'pg_reactive';" },
      { type: 'result-table', label: 'Query result',
        columns: ['extname', 'extversion'],
        rows: [['pg_reactive', '0.1.1']],
        rowCount: '1 row' }
    ]
  },
  /* 2 */ {
    title: 'Subscribe \u2014 Basic WHERE Filter (Delta Mode)',
    badges: ['subscribe', 'dml'],
    explain: 'Create a live query tracking electronics products. `pgr.subscribe()` parses SQL, identifies tables, installs AFTER STATEMENT triggers, takes a snapshot, and returns metadata. Default mode is `delta` \u2014 full row-level diffs.',
    blocks: [
      { type: 'sql', label: 'Subscribe to WHERE filter',
        copyText: "SELECT pgr.subscribe('tut_electronics', 'SELECT id, name, price FROM tut_products WHERE category = ''electronics''');",
        sql: "SELECT pgr.subscribe(\n  'tut_electronics',\n  'SELECT id, name, price FROM tut_products\n   WHERE category = ''electronics'''\n);" },
      { type: 'result-table', label: 'Subscribe result',
        columns: ['subscribe'],
        rows: [['{"query_id":"tut_electronics","tables":1,"mode":"delta"}']],
        rowCount: '1 row' },
      { type: 'info', title: 'What happened internally', items: [
        'Parsed the SELECT to extract table OID for `tut_products`',
        'Registered dependency in shared memory hash table',
        'Installed AFTER INSERT/UPDATE/DELETE triggers on `tut_products`',
        'Created snapshot: `pgr._snap_tut_electronics` (UNLOGGED table)',
        'Populated snapshot with current query results (3 rows)'
      ]},
      { type: 'flow', stages: [
        { label: 'pgr.subscribe()', active: true },
        { label: 'Parse SQL' },
        { label: 'Extract OIDs' },
        { label: 'Install triggers' },
        { label: 'Create snapshot' }
      ]}
    ]
  },
  /* 3 */ {
    title: 'INSERT \u2014 Delta Notification',
    badges: ['dml'],
    explain: 'Insert a new electronics product. The AFTER INSERT trigger fires, recomputes the query using EXCEPT against the snapshot, detects the new row, and sends a delta via `pg_notify(\'pgr\', ...)`.',
    blocks: [
      { type: 'sql', label: 'Insert a product',
        copyText: "INSERT INTO tut_products (name, category, price) VALUES ('Monitor', 'electronics', 499.99);",
        sql: "INSERT INTO tut_products (name, category, price)\nVALUES ('Monitor', 'electronics', 499.99);" },
      { type: 'result-table', label: 'Command result',
        columns: ['status'], rows: [['INSERT 0 1']], rowCount: '' },
      { type: 'json', label: 'WebSocket notification', mode: 'delta',
        json: { query_id: 'tut_electronics', inserted: [{ id: 6, name: 'Monitor', price: 499.99 }], deleted: [] } },
      { type: 'flow', stages: [
        { label: 'INSERT' },
        { label: 'AFTER STMT trigger', active: true },
        { label: 'EXCEPT recompute' },
        { label: 'pg_notify(pgr)' },
        { label: 'WS broadcast' }
      ]}
    ]
  },
  /* 4 */ {
    title: 'UPDATE \u2014 Delete + Insert Pair',
    badges: ['dml'],
    explain: 'Update a product\'s price. The EXCEPT-based delta sees the old row disappeared and a new one appeared. The notification contains both `deleted` and `inserted` \u2014 this is how UPDATEs look in delta mode.',
    blocks: [
      { type: 'sql', label: 'Update price',
        copyText: "UPDATE tut_products SET price = 899.99 WHERE name = 'Monitor';",
        sql: "UPDATE tut_products\nSET price = 899.99\nWHERE name = 'Monitor';" },
      { type: 'result-table', label: 'Command result',
        columns: ['status'], rows: [['UPDATE 1']], rowCount: '' },
      { type: 'json', label: 'WebSocket notification', mode: 'delta',
        json: { query_id: 'tut_electronics', inserted: [{ id: 6, name: 'Monitor', price: 899.99 }], deleted: [{ id: 6, name: 'Monitor', price: 499.99 }] } },
      { type: 'flow', stages: [
        { label: 'UPDATE' },
        { label: 'AFTER STMT trigger', active: true },
        { label: 'EXCEPT recompute' },
        { label: 'pg_notify(pgr)' },
        { label: 'WS broadcast' }
      ]}
    ]
  },
  /* 5 */ {
    title: 'DELETE \u2014 Row Removal',
    badges: ['dml'],
    explain: 'Delete the product. Only the `deleted` array is populated \u2014 the row disappeared from the result set.',
    blocks: [
      { type: 'sql', label: 'Delete product',
        copyText: "DELETE FROM tut_products WHERE name = 'Monitor';",
        sql: "DELETE FROM tut_products\nWHERE name = 'Monitor';" },
      { type: 'result-table', label: 'Command result',
        columns: ['status'], rows: [['DELETE 1']], rowCount: '' },
      { type: 'json', label: 'WebSocket notification', mode: 'delta',
        json: { query_id: 'tut_electronics', inserted: [], deleted: [{ id: 6, name: 'Monitor', price: 899.99 }] } },
      { type: 'flow', stages: [
        { label: 'DELETE' },
        { label: 'AFTER STMT trigger', active: true },
        { label: 'EXCEPT recompute' },
        { label: 'pg_notify(pgr)' },
        { label: 'WS broadcast' }
      ]}
    ]
  },
  /* 6 */ {
    title: 'Subscribe \u2014 Multi-Table JOIN',
    badges: ['subscribe', 'join'],
    explain: 'Subscribe to a 3-table JOIN. `pg_reactive` finds all 3 table OIDs and installs triggers on each. A change to any joined table triggers recomputation. CDC tools like Debezium cannot do this.',
    blocks: [
      { type: 'sql', label: 'Subscribe to JOIN query',
        copyText: "SELECT pgr.subscribe('tut_order_feed',\n  'SELECT o.id, c.name AS customer, p.name AS product, o.quantity, o.total\n   FROM tut_orders o\n   JOIN tut_customers c ON c.id = o.customer_id\n   JOIN tut_products p ON p.id = o.product_id\n   ORDER BY o.id');",
        sql: "SELECT pgr.subscribe('tut_order_feed',\n  'SELECT o.id, c.name AS customer,\n          p.name AS product,\n          o.quantity, o.total\n   FROM tut_orders o\n   JOIN tut_customers c ON c.id = o.customer_id\n   JOIN tut_products p ON p.id = o.product_id\n   ORDER BY o.id');" },
      { type: 'result-table', label: 'Subscribe result',
        columns: ['subscribe'],
        rows: [['{"query_id":"tut_order_feed","tables":3,"mode":"delta"}']],
        rowCount: '1 row' },
      { type: 'info', title: 'Triggers installed on 3 tables', items: [
        '`tut_orders` \u2014 primary order table',
        '`tut_customers` \u2014 joined via customer_id',
        '`tut_products` \u2014 joined via product_id',
        'A change to ANY of these 3 tables recomputes the join query'
      ]}

/* ── DOM helpers ── */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderTextWithCode(container, text) {
  var parts = text.split('`');
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      container.appendChild(el('code', '', parts[i]));
    } else if (parts[i]) {
      container.appendChild(document.createTextNode(parts[i]));
    }
  }
}

/* ── SQL tokenizer ── */
function tokenizeSQL(text) {
  var KW = /\b(SELECT|FROM|WHERE|INSERT|INTO|UPDATE|SET|DELETE|JOIN|ON|ORDER|BY|GROUP|HAVING|AS|VALUES|AND|OR|NOT|IN|WITH|OVER|PARTITION|DESC|ASC|LIMIT|DISTINCT|CREATE|TABLE|IF|EXISTS|EXTENSION|LEFT|RIGHT|INNER|OUTER|BETWEEN|LIKE|CASE|WHEN|THEN|ELSE|END|NULL|DEFAULT|PRIMARY|KEY|SERIAL|TEXT|INTEGER|NUMERIC|BOOLEAN|TIMESTAMPTZ|AFTER|STATEMENT|UNLOGGED)\b/g;
  var FN = /\b(pgr\.subscribe|pgr\.unsubscribe|pgr\.get_subscriptions|COUNT|SUM|AVG|MIN|MAX|RANK|ROW_NUMBER|DENSE_RANK|count)\b/g;
  var tokens = [];
  var lines = text.split('\n');
  for (var li = 0; li < lines.length; li++) {
    if (li > 0) tokens.push({ cls: '', text: '\n' });
    var line = lines[li];
    if (line.match(/^\s*#/)) { tokens.push({ cls: 'sc', text: line }); continue; }
    if (line.match(/^\s*--/)) { tokens.push({ cls: 'sc', text: line }); continue; }
    var pos = 0;
    while (pos < line.length) {
      var ch = line[pos];
      if (ch === "'") {
        var end = line.indexOf("'", pos + 1);
        if (end === -1) end = line.length - 1;
        while (end + 1 < line.length && line[end + 1] === "'") {
          end = line.indexOf("'", end + 2);
          if (end === -1) { end = line.length - 1; break; }
        }
        tokens.push({ cls: 'ss', text: line.substring(pos, end + 1) });
        pos = end + 1;
      } else if (/[0-9]/.test(ch) && (pos === 0 || /[\s,=(]/.test(line[pos - 1]))) {
        var num = '';
        while (pos < line.length && /[0-9.]/.test(line[pos])) { num += line[pos]; pos++; }
        tokens.push({ cls: 'sn', text: num });
      } else if (/[a-zA-Z_]/.test(ch)) {
        var word = '';
        var wStart = pos;
        while (pos < line.length && /[a-zA-Z0-9_.*]/.test(line[pos])) { word += line[pos]; pos++; }
        if (word.match(/^(pgr\.\w+|COUNT|SUM|AVG|MIN|MAX|RANK|ROW_NUMBER|DENSE_RANK|count)$/i)) {
          tokens.push({ cls: 'sf', text: word });
        } else if (word.match(/^(SELECT|FROM|WHERE|INSERT|INTO|UPDATE|SET|DELETE|JOIN|ON|ORDER|BY|GROUP|HAVING|AS|VALUES|AND|OR|NOT|IN|WITH|OVER|PARTITION|DESC|ASC|LIMIT|DISTINCT|CREATE|TABLE|IF|EXISTS|EXTENSION|LEFT|RIGHT|INNER|OUTER|BETWEEN|LIKE|CASE|WHEN|THEN|ELSE|END|NULL|DEFAULT|PRIMARY|KEY|SERIAL|TEXT|INTEGER|NUMERIC|BOOLEAN|TIMESTAMPTZ|AFTER|STATEMENT|UNLOGGED)$/i)) {
          tokens.push({ cls: 'sk', text: word });
        } else {
          tokens.push({ cls: '', text: word });
        }
      } else {
        tokens.push({ cls: '', text: ch });
        pos++;
      }
    }
  }
  return tokens;
}

/* ── JSON renderer ── */
function renderJSON(container, obj, indent) {
  indent = indent || 0;
  var pad = '';
  for (var p = 0; p < indent; p++) pad += '  ';
  var pad1 = pad + '  ';

  if (Array.isArray(obj)) {
    container.appendChild(el('span', 'jb', '['));
    if (obj.length === 0) {
      container.appendChild(el('span', 'jb', ']'));
      return;
    }
    container.appendChild(document.createTextNode('\n'));
    for (var ai = 0; ai < obj.length; ai++) {
      container.appendChild(document.createTextNode(pad1));
      renderJSON(container, obj[ai], indent + 1);
      if (ai < obj.length - 1) container.appendChild(el('span', 'jp', ','));
      container.appendChild(document.createTextNode('\n'));
    }
    container.appendChild(document.createTextNode(pad));
    container.appendChild(el('span', 'jb', ']'));
  } else if (obj !== null && typeof obj === 'object') {
    var keys = Object.keys(obj);
    container.appendChild(el('span', 'jb', '{'));
    if (keys.length === 0) {
      container.appendChild(el('span', 'jb', '}'));
      return;
    }
    container.appendChild(document.createTextNode('\n'));
    for (var ki = 0; ki < keys.length; ki++) {
      container.appendChild(document.createTextNode(pad1));
      container.appendChild(el('span', 'jk', '"' + keys[ki] + '"'));
      container.appendChild(el('span', 'jp', ': '));
      renderJSON(container, obj[keys[ki]], indent + 1);
      if (ki < keys.length - 1) container.appendChild(el('span', 'jp', ','));
      container.appendChild(document.createTextNode('\n'));
    }
    container.appendChild(document.createTextNode(pad));
    container.appendChild(el('span', 'jb', '}'));
  } else if (typeof obj === 'string') {
    container.appendChild(el('span', 'js', '"' + obj + '"'));
  } else if (typeof obj === 'number') {
    container.appendChild(el('span', 'jn', String(obj)));
  } else if (typeof obj === 'boolean' || obj === null) {
    container.appendChild(el('span', 'jl', String(obj)));
  }
}

/* ── Component builders ── */

function buildSQLBlock(block, stepIdx, blockIdx) {
  var panel = el('div', 'sql-panel');
  panel.id = 'sql-' + stepIdx + '-' + blockIdx;
  var head = el('div', 'sql-head');
  head.appendChild(el('span', 'sql-badge', 'SQL'));
  head.appendChild(el('span', 'sql-label', block.label || ''));
  if (block.copyText) {
    var btn = el('button', 'copy-btn', 'Copy');
    btn.dataset.stepIdx = stepIdx;
    btn.dataset.blockIdx = blockIdx;
    btn.addEventListener('click', handleCopy);
    head.appendChild(btn);
  }
  panel.appendChild(head);

  var body = el('div', 'sql-body');
  var tokens = tokenizeSQL(block.sql);
  tokens.forEach(function(t) {
    if (t.text === '\n') {
      body.appendChild(document.createTextNode('\n'));
    } else {
      var s = el('span', t.cls, t.text);
      body.appendChild(s);
    }
  });
  panel.appendChild(body);
  return panel;
}

function buildResultTable(block) {
  var panel = el('div', 'result-panel');
  var head = el('div', 'result-head');
  head.appendChild(el('span', 'result-badge', 'Result'));
  head.appendChild(el('span', 'result-label', block.label || ''));
  panel.appendChild(head);

  var table = el('table', 'result-table');
  var thead = document.createElement('thead');
  var hrow = document.createElement('tr');
  block.columns.forEach(function(col) {
    hrow.appendChild(el('th', '', col));
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  block.rows.forEach(function(row) {
    var tr = document.createElement('tr');
    row.forEach(function(cell) {
      tr.appendChild(el('td', '', cell));
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  panel.appendChild(table);

  if (block.rowCount) {
    panel.appendChild(el('div', 'result-footer', '(' + block.rowCount + ')'));
  }
  return panel;
}

function buildJSONViewer(block) {
  var isNotify = block.mode === 'notify';
  var panel = el('div', 'json-panel ' + (isNotify ? 'json-notify' : 'json-delta'));
  var head = el('div', 'json-head');

  renderJSON(body, block.json, 0);
  body.appendChild(document.createTextNode('\n'));
  panel.appendChild(body);
  return panel;
}

function buildInfoBlock(block) {
  var card = el('div', 'info-card');
  if (block.title) {
    card.appendChild(el('div', 'info-title', block.title));

  if (block.plain) {
    var p = el('div', 'info-plain');
    renderTextWithCode(p, block.plain);
    card.appendChild(p);

  if (block.items) {
    var ol = document.createElement('ol');
    block.items.forEach(function(item) {
      var li = document.createElement('li');
      renderTextWithCode(li, item);
      ol.appendChild(li);

  return card;
}

function buildStepCard(step, idx) {
  var card = el('div', 'step-card');
  card.dataset.step = idx;

  // Step header
  var header = el('div', 'step-header');
  var num = el('div', 'step-num', String(idx + 1));
  num.style.background = chapterColor(idx);
  header.appendChild(num);

  var meta = el('div', 'step-meta');
  meta.appendChild(el('h2', '', step.title));
  var badges = el('div', 'step-badges');
  step.badges.forEach(function(b) {
    badges.appendChild(el('span', 'badge ' + (BADGE_CLS[b] || ''), b));
  });
  meta.appendChild(badges);
  header.appendChild(meta);
  card.appendChild(header);

  // Explanation
  var expl = el('div', 'explain-card');
  renderTextWithCode(expl, step.explain);
  card.appendChild(expl);

  // Blocks
  step.blocks.forEach(function(block, bi) {
    if (block.type === 'sql') {
      card.appendChild(buildSQLBlock(block, idx, bi));
    } else if (block.type === 'result-table') {
      card.appendChild(buildResultTable(block));
    } else if (block.type === 'json') {
      card.appendChild(buildJSONViewer(block));
    } else if (block.type === 'info') {
      card.appendChild(buildInfoBlock(block));
    } else if (block.type === 'flow') {
      card.appendChild(buildFlowDiagram(block));
    } else if (block.type === 'summary') {
      card.appendChild(buildSummaryTable());
    }
  });

  return card;
}

/* ── Stepper builder ── */
function buildStepper() {
  var track = document.getElementById('stepperTrack');
  while (track.firstChild) track.removeChild(track.firstChild);

  for (var i = 0; i < STEPS.length; i++) {
    if (i > 0) {
      var line = el('div', 'stepper-line' + (i <= currentStep ? ' done' : ''));
      track.appendChild(line);
    }
    var node = el('button', 'stepper-node');
    node.textContent = String(i + 1);
    if (i < currentStep) node.classList.add('done');
    if (i === currentStep) node.classList.add('current');
    node.dataset.step = i;
    node.addEventListener('click', function() {
      var target = parseInt(this.dataset.step);
      currentStep = target;
      render();
      updateNav();
    });
    track.appendChild(node);
  }

  // Chapter labels
  var chapters = document.getElementById('stepperChapters');
  while (chapters.firstChild) chapters.removeChild(chapters.firstChild);
  CHAPTERS.forEach(function(ch) {
    var label = el('span', 'stepper-chapter', ch.title);
    label.style.color = ch.color;
    chapters.appendChild(label);
  });

  // Compact (mobile)
  var compact = document.getElementById('stepperCompact');
  compact.textContent = 'Step ' + (currentStep + 1) + ' of ' + STEPS.length + ' \u2014 ' + STEPS[currentStep].title;
}

/* ── Render ── */
function render() {
  var wrap = document.getElementById('stepWrap');
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);

  if (allMode) {
    document.body.classList.add('all-mode');
    var prevChapter = -1;
    STEPS.forEach(function(step, i) {
      var ch = chapterOf(i);
      if (ch !== prevChapter) {
        var divider = el('div', 'chapter-divider');
        var label = el('span', '', CHAPTERS[ch].title);
        label.style.color = CHAPTERS[ch].color;
        divider.appendChild(label);
        wrap.appendChild(divider);
        prevChapter = ch;
      }
      var card = buildStepCard(step, i);
      card.classList.add('active');
      wrap.appendChild(card);
    });
  } else {
    document.body.classList.remove('all-mode');
    STEPS.forEach(function(step, i) {
      var card = buildStepCard(step, i);
      if (i === currentStep) card.classList.add('active');
      wrap.appendChild(card);
    });
  }

  buildStepper();
}

function updateNav() {
  document.getElementById('prevBtn').disabled = allMode || currentStep === 0;
  document.getElementById('nextBtn').disabled = allMode || currentStep === STEPS.length - 1;
  document.getElementById('navCenter').textContent = 'Step ' + (currentStep + 1) + ' / ' + STEPS.length;
  document.getElementById('stepperCompact').textContent = 'Step ' + (currentStep + 1) + ' of ' + STEPS.length + ' \u2014 ' + STEPS[currentStep].title;
  buildStepper();
}

function navigate(dir) {
  if (allMode) return;
  var next = currentStep + dir;
  if (next < 0 || next >= STEPS.length) return;
  currentStep = next;
  var cards = document.querySelectorAll('#stepWrap .step-card');
  cards.forEach(function(c, i) {
    if (i === currentStep) c.classList.add('active');
    else c.classList.remove('active');
  });
  updateNav();
  document.getElementById('contentArea').scrollTop = 0;
}

function toggleView() {
  allMode = !allMode;
  document.getElementById('viewToggle').textContent = allMode ? 'Step View' : 'Show All';
  render();
  updateNav();
}

function handleCopy(e) {
  var btn = e.currentTarget;
  var si = parseInt(btn.dataset.stepIdx);
  var bi = parseInt(btn.dataset.blockIdx);
  var text = STEPS[si].blocks[bi].copyText;
  if (!text) return;
  navigator.clipboard.writeText(text).then(function() {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

/* ── No in-browser SQL execution (round 36, SECURITY.md invariant 13) ──
 * This page used to render an "Execute" button that POSTed each SQL block
 * to the raw-SQL endpoint as service_role. That can never work and must
 * never work from a public page: the service-role key is deliberately not
 * exposed to browsers (see ../config.js), and the endpoint is not mounted
 * in production - the button only produced a cryptic JSON.parse error on
 * the plain-text 404. SQL blocks are copy-paste material for the Studio
 * SQL editor (dev stacks) or psql. The SEC-R13 lint rule guards this
 * file class. */

/* ── Keyboard navigation ── */
document.addEventListener('keydown', function(e) {
  if (allMode) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navigate(-1); }
  if (e.key === 'Home') { e.preventDefault(); currentStep = 0; render(); updateNav(); }
  if (e.key === 'End') { e.preventDefault(); currentStep = STEPS.length - 1; render(); updateNav(); }
});

/* ── Event listeners ── */
document.getElementById('prevBtn').addEventListener('click', function() { navigate(-1); });
document.getElementById('nextBtn').addEventListener('click', function() { navigate(1); });
document.getElementById('viewToggle').addEventListener('click', toggleView);

/* ── Init ── */
render();
updateNav();
</script>

</body>
</html>
