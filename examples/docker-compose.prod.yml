# Production override for the examples stack.
#
# Layered on top of examples/docker-compose.yml:
#
#   docker compose \
#     -f examples/docker-compose.yml \
#     -f examples/docker-compose.prod.yml \
#     up -d --build
#
# Hardening (since the 2026-05 audit):
#   * NO host ports — traffic enters only through the umbrella nginx over
#     the shared `gateway` network. Siblings on the same VPS can't collide.
#   * `restart: unless-stopped` on everything that should auto-resume.
#   * `web` reachable as `pgr-web`, proxy as `pgr-proxy` over `gateway`.
#   * `ENABLE_SQL_ENDPOINT=false` — the dev base turns it on; prod must not
#     expose raw-SQL even behind service_role.
#   * `POSTGRES_HOST_AUTH_METHOD=scram-sha-256` — overrides the dev `trust`.
#   * `REQUIRE_AUTHENTICATED_WS=true` — no anon-key WS subscriptions.
#   * Secrets are FAIL-FAST: ${VAR:?…} aborts `docker compose up` when a
#     value is missing rather than silently falling back to the publicly
#     known dev defaults. Set in /opt/apps/pg-reactive-src/.env or via the
#     deploy environment.

services:
  db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

  proxy:
    restart: unless-stopped
    ports: !reset []
    environment:
      # Override the dev DATABASE_URL (which hard-codes postgres:postgres).
      # Without this, scram-sha-256 + a random POSTGRES_PASSWORD would
      # leave the proxy unable to connect to its own DB.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?required}@db:5432/pg_reactive_test
      # Hardening: anon-key holders cannot open live-query WebSockets —
      # only real JWTs. The dev base keeps this off so public live queries
      # in tutorials work without auth.
      REQUIRE_AUTHENTICATED_WS: "true"
      # /api/sql is mounted only when this is true. Off in prod — even a
      # leaked SERVICE_ROLE_KEY cannot reach SQL execution.
      ENABLE_SQL_ENDPOINT: "false"
      # Production marker: when set, the proxy fail-fasts on empty / dev
      # JWT secrets, permissive CORS, and other "demo-only" combinations.
      PGSTACK_ENV: production
      # Fail-fast secrets — `:?` aborts startup if the env var is unset.
      # Generate with `openssl rand -base64 32` (32+ bytes each).
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET required (32+ chars, not dev-only)}
      ANON_KEY:          ${ANON_KEY:?ANON_KEY required (random 32+ bytes)}
      SERVICE_ROLE_KEY:  ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY required (random 32+ bytes)}
      # At-rest encryption for edge-function env vars.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY required for at-rest secrets}
      # Lock CORS to whatever fronts you. Empty + permissive=false = strict
      # (cross-origin browsers blocked; same-origin still works).
      ALLOWED_ORIGINS:   ${ALLOWED_ORIGINS:-}
      # SMTP — required in PGSTACK_ENV=production (audit round 26 F5: a
      # console-logged reset URL is a takeover token in plaintext). The
      # defaults wire the proxy at a sibling Inbucket container, a fake
      # SMTP catcher that accepts any auth and exposes the captured mail
      # over a web UI. Honest satisfaction of the audit gate without
      # shipping real credentials in a public demo. Override SMTP_HOST in
      # .env to point at a real provider (SendGrid, Mailgun, SES, etc.).
      SMTP_HOST: ${SMTP_HOST:-inbucket}
      SMTP_PORT: ${SMTP_PORT:-2500}
      SMTP_USER: ${SMTP_USER:-demo}
      SMTP_PASS: ${SMTP_PASS:-demo}
    networks:
      default:
      gateway:
        aliases:
          - pgr-proxy

  hello-go:
    restart: unless-stopped

  # The `setup` container connects as `postgres`; the dev base relies on
  # trust auth, but prod uses scram-sha-256 with a random password.
  # PGPASSWORD is the libpq env var that psql picks up automatically.
  setup:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}

  web:
    restart: unless-stopped
    ports: !reset []
    # The default block in docker-compose.yml already declares the
    # gateway alias `pgr-web`; the override just keeps it without
    # re-exposing :3000 on the host.

  # Fake SMTP catcher. Satisfies the PGSTACK_ENV=production SMTP gate
  # without shipping real credentials. Listens on :2500 (SMTP) and :9000
  # (web UI) on the internal `default` network; not exposed to the host —
  # umbrella nginx can route to it if the admin needs to read captured
  # mail. Replace with a real provider in .env when going live.
  inbucket:
    image: inbucket/inbucket:edge
    restart: unless-stopped
