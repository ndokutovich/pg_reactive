<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>05 — Notify Mode</title>
<link rel="icon" href="../favicon.svg">
<script src="../config.js"></script>
<script src="../_lib/pgstack.js"></script>
<style>
  body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:24px; max-width:880px; margin-inline:auto; }
  h1 { margin:0 0 4px; color:#58a6ff; }
  .sub { color:#8b949e; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; min-height:240px; }
  h2 { margin:0 0 8px; font-size:13px; color:#8b949e; text-transform:uppercase; letter-spacing:0.05em; }
  .meta { font-size:11px; color:#8b949e; margin-bottom:12px; font-family:ui-monospace,Consolas,monospace; }
  table { width:100%; border-collapse:collapse; font-size:12px; font-family:ui-monospace,Consolas,monospace; }
  td { padding:4px 8px; border-bottom:1px solid #21262d; }
  .pulse { animation: p 0.4s ease-out; }
  @keyframes p { from { background:#1f6feb44; } to { background:transparent; } }
  button { background:#238636; color:#fff; border:0; border-radius:6px; padding:8px 16px; font:inherit; cursor:pointer; }
  code { background:#21262d; padding:2px 6px; border-radius:4px; font-family:ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<h1>05 — Notify Mode</h1>
<p class="sub">
  Same sensor data, two subscriptions side-by-side: <code>notify</code>
  sends just an invalidation signal; <code>delta</code> ships full rows.
  Click "insert reading" — you'll see <em>delta</em> add a row, while
  <em>notify</em> just pulses and re-fetches via REST.
</p>

<button id="insert">Insert random reading</button>

<div class="grid" style="margin-top:16px">
  <div class="panel" id="notify-panel">
    <h2>notify mode</h2>
    <div class="meta" id="notify-meta">waiting…</div>
    <table><tbody id="notify-rows"></tbody></table>
  </div>
  <div class="panel" id="delta-panel">
    <h2>delta mode</h2>
    <div class="meta" id="delta-meta">waiting…</div>
    <table><tbody id="delta-rows"></tbody></table>
  </div>
</div>

<script>
const pg = new PgStack();
const sensors = ['A', 'B', 'C'];

function fmtRow(r) {
  return `#${r.id} sensor=${r.sensor_id} t=${r.temperature}°C h=${r.humidity}%`;
}

function renderRows(tbody, rows) {
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  for (const r of rows) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.textContent = fmtRow(r);
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

function pulse(panel) {
  panel.classList.remove('pulse');
  void panel.offsetWidth;
  panel.classList.add('pulse');
}

// ── notify mode: signal only, fetch ourselves ──
{
  const panel = document.getElementById('notify-panel');
  const meta  = document.getElementById('notify-meta');
  const tbody = document.getElementById('notify-rows');
  let invalidations = 0;

  async function refetch() {
    const rows = await pg.rest('/sensor_readings?order=recorded_at.desc&limit=20');
    renderRows(tbody, rows);
  }

  pg.liveQuery('sensor_notify', {
    onInvalidate() {
      invalidations++;
      meta.textContent = `invalidations: ${invalidations} (fetching via REST…)`;
      pulse(panel);
      refetch();
    },
    onSnapshot()  { /* notify never sends snapshot */ },
    onDelta()     { /* notify never sends deltas */ },
    onError(e)    { meta.textContent = 'error: ' + (e?.message || 'ws'); }
  }, { anon: true });

  refetch().then(() => { meta.textContent = `invalidations: 0`; });
}

// ── delta mode: rows arrive on the wire ──
{
  const meta  = document.getElementById('delta-meta');
  const tbody = document.getElementById('delta-rows');
  const map = new Map();
  let deltas = 0;

  const reflow = () => renderRows(
    tbody,
    [...map.values()].sort((a, b) => b.recorded_at.localeCompare(a.recorded_at))
  );

  pg.liveQuery('sensor_delta', {
    onSnapshot(rows) { for (const r of rows) map.set(r.id, r); reflow();
                       meta.textContent = `snapshot: ${rows.length} rows`; },
    onDelta(ins, del) {
      deltas++;
      for (const r of del) map.delete(r.id);
      for (const r of ins) map.set(r.id, r);
      reflow();
      meta.textContent = `deltas received: ${deltas}`;
    },
    onError(e) { meta.textContent = 'error: ' + (e?.message || 'ws'); }
  }, { anon: true });
}

document.getElementById('insert').onclick = async () => {
  await pg.rest('/sensor_readings', {
    method: 'POST',
    body: JSON.stringify({
      sensor_id: sensors[Math.floor(Math.random() * sensors.length)],
      temperature: (15 + Math.random() * 15).toFixed(2),
      humidity:    (30 + Math.random() * 50).toFixed(2)
    })
  });
};
</script>
</body>
</html>
