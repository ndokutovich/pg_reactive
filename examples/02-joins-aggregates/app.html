<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>02 — Joins + Aggregates</title>
<link rel="icon" href="../favicon.svg">
<script src="../config.js"></script>
<script src="../_lib/pgstack.js"></script>
<style>
  body { font: 14px -apple-system, BlinkMacSystemFont, sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:24px; max-width:880px; margin-inline:auto; }
  h1 { margin:0 0 4px; color:#58a6ff; }
  .sub { color:#8b949e; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; }
  h2 { margin:0 0 12px; font-size:13px; color:#8b949e; text-transform:uppercase; letter-spacing:0.05em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 8px; text-align:left; border-bottom:1px solid #30363d; }
  th { color:#8b949e; font-weight:600; font-size:11px; text-transform:uppercase; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  button { background:#238636; color:#fff; border:0; border-radius:6px; padding:8px 16px; font:inherit; cursor:pointer; margin-right:8px; }
</style>
</head>
<body>
<h1>02 — Joins + Aggregates</h1>
<p class="sub">Two live subscriptions on the same data — one aggregates with <em>GROUP BY + LEFT JOIN</em>, the other adds a window function. Add orders to watch both refresh independently.</p>

<button id="add">Add random order</button>

<div class="grid" style="margin-top:16px">
  <div class="panel">
    <h2>Revenue by customer</h2>
    <table>
      <thead><tr><th>Customer</th><th>Region</th><th>Orders</th><th>Revenue</th></tr></thead>
      <tbody id="rev"></tbody>
    </table>
  </div>
  <div class="panel">
    <h2>Regional top spenders</h2>
    <table>
      <thead><tr><th>Region</th><th>#</th><th>Customer</th><th>Revenue</th></tr></thead>
      <tbody id="rank"></tbody>
    </table>
  </div>
</div>

<script>
const pg = new PgStack();

function cell(tr, text, cls) {
  const td = document.createElement('td');
  td.textContent = text;
  if (cls) td.className = cls;
  tr.appendChild(td);
}

function renderTable(tbody, rows, fields) {
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  for (const r of rows) {
    const tr = document.createElement('tr');
    for (const f of fields) cell(tr, r[f.key], f.cls);
    tbody.appendChild(tr);
  }
}

// Live: revenue by customer.
{
  const tbody = document.getElementById('rev');
  const map = new Map();
  const reflow = () => renderTable(
    tbody,
    [...map.values()].sort((a, b) => b.revenue - a.revenue),
    [{ key:'name' }, { key:'region' }, { key:'order_count', cls:'num' }, { key:'revenue', cls:'num' }]
  );
  pg.liveQuery('revenue_by_customer', {
    onSnapshot(rows) { for (const r of rows) map.set(r.id, r); reflow(); },
    onDelta(ins, del) {
      for (const r of del) map.delete(r.id);
      for (const r of ins) map.set(r.id, r);
      reflow();
    }
  }, { anon: true });
}

// Live: regional top (compound key region+name).
{
  const tbody = document.getElementById('rank');
  const map = new Map();
  const key = r => r.region + '|' + r.name;
  const reflow = () => renderTable(
    tbody,
    [...map.values()].sort((a, b) =>
      a.region.localeCompare(b.region) || a.rank - b.rank),
    [{ key:'region' }, { key:'rank', cls:'num' }, { key:'name' }, { key:'revenue', cls:'num' }]
  );
  pg.liveQuery('regional_top_spenders', {
    onSnapshot(rows) { for (const r of rows) map.set(key(r), r); reflow(); },
    onDelta(ins, del) {
      for (const r of del) map.delete(key(r));
      for (const r of ins) map.set(key(r), r);
      reflow();
    }
  }, { anon: true });
}

document.getElementById('add').onclick = async () => {
  const customer_id = 1 + Math.floor(Math.random() * 4);
  const product = ['Widget', 'Sprocket', 'Cable', 'Adapter'][Math.floor(Math.random() * 4)];
  const qty = 1 + Math.floor(Math.random() * 3);
  const total = (qty * (Math.random() * 80 + 20)).toFixed(2);
  await pg.rest('/orders', {
    method: 'POST',
    body: JSON.stringify({ customer_id, product, qty, total })
  });
};
</script>
</body>
</html>
