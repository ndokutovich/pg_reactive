<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>What to Buy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d97706">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
/* ── Reset & Variables ──────────────────────────────────────────── */
:root {
  --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-200:#fde68a; --amber-300:#fcd34d;
  --amber-400:#fbbf24; --amber-500:#f59e0b; --amber-600:#d97706; --amber-700:#b45309;
  --green-50:#ecfdf5; --green-500:#10b981; --green-600:#059669;
  --red-50:#fef2f2; --red-500:#ef4444; --red-600:#dc2626;
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
  --gray-400:#9ca3af; --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151;
  --gray-800:#1f2937; --gray-900:#111827;
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -1px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px -5px rgba(0,0,0,.1),0 4px 10px -2px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ease:.2s ease;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--amber-50); color:var(--gray-800); line-height:1.6; min-height:100vh; min-height:100dvh; -webkit-tap-highlight-color:transparent; }
a { color:var(--amber-700); }

/* ── Utilities ──────────────────────────────────────────────────── */
.hidden { display:none !important; }
.spinner { width:18px; height:18px; border:2px solid var(--gray-300); border-top-color:var(--amber-600); border-radius:50%; animation:spin .6s linear infinite; display:inline-block; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideIn { from { opacity:0; transform:translateX(60px); } to { opacity:1; transform:translateX(0); } }
@keyframes slideOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(60px); } }

/* ── Typography ─────────────────────────────────────────────────── */
h1 { font-size:1.5rem; font-weight:700; letter-spacing:-.02em; }
h2 { font-size:1.125rem; font-weight:600; color:var(--gray-700); }
.text-sm { font-size:.875rem; }
.text-xs { font-size:.75rem; }
.text-muted { color:var(--gray-500); }
.text-center { text-align:center; }

/* ── Buttons ────────────────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 20px; border:none; border-radius:var(--radius-sm); font:inherit; font-size:.9rem; font-weight:600; cursor:pointer; transition:all var(--ease); white-space:nowrap; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-primary { background:var(--amber-600); color:#fff; box-shadow:var(--shadow); }
.btn-primary:hover:not(:disabled) { background:var(--amber-700); box-shadow:var(--shadow-md); }
.btn-secondary { background:var(--gray-100); color:var(--gray-700); }
.btn-secondary:hover:not(:disabled) { background:var(--gray-200); }
.btn-danger { background:transparent; color:var(--red-500); padding:8px; }
.btn-danger:hover { background:var(--red-50); }
.btn-ghost { background:transparent; color:var(--gray-600); padding:8px; }
.btn-ghost:hover { background:var(--gray-100); }
.btn-icon { width:40px; height:40px; padding:0; border-radius:50%; flex-shrink:0; }
.btn-full { width:100%; }

/* ── Inputs ─────────────────────────────────────────────────────── */
.input { width:100%; padding:10px 14px; border:1.5px solid var(--gray-200); border-radius:var(--radius-sm); font:inherit; font-size:.9rem; background:#fff; transition:all var(--ease); outline:none; }
.input:focus { border-color:var(--amber-400); box-shadow:0 0 0 3px rgba(251,191,36,.15); }
.input::placeholder { color:var(--gray-400); }
.input-row { display:flex; gap:8px; }

/* ── Cards ──────────────────────────────────────────────────────── */
.card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; }

/* ── Screens ────────────────────────────────────────────────────── */
.screen { display:none; animation:fadeIn .3s ease; }
.screen.active { display:block; }
.screen-center { align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; padding:24px; }
.screen-center.active { display:flex; }

/* ── App Bar ────────────────────────────────────────────────────── */
.appbar { position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--gray-200); padding:0 16px; height:56px; display:flex; align-items:center; gap:12px; }
.appbar h1 { flex:1; font-size:1.125rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.appbar .user-email { font-size:.8rem; color:var(--gray-500); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── Content Container ──────────────────────────────────────────── */
.container { max-width:560px; margin:0 auto; padding:16px; }

/* ── Setup Screen ───────────────────────────────────────────────── */
.setup-card { max-width:440px; width:100%; text-align:center; }
.setup-card .icon { font-size:3rem; margin-bottom:12px; }
.setup-card p { color:var(--gray-500); margin:8px 0 24px; line-height:1.5; }
.setup-log { margin-top:16px; text-align:left; max-height:200px; overflow-y:auto; background:var(--gray-50); border-radius:var(--radius-sm); padding:12px; font-size:.8rem; font-family:monospace; }
.setup-log .ok { color:var(--green-600); }
.setup-log .err { color:var(--red-500); }
.setup-log .skip { color:var(--gray-400); }

/* ── Auth Screen ────────────────────────────────────────────────── */
.auth-card { max-width:380px; width:100%; }
.auth-card h1 { text-align:center; margin-bottom:4px; }
.auth-card .subtitle { text-align:center; color:var(--gray-500); margin-bottom:24px; font-size:.9rem; }
.auth-form { display:flex; flex-direction:column; gap:12px; }
.auth-toggle { text-align:center; margin-top:16px; font-size:.875rem; color:var(--gray-500); }
.auth-toggle a { cursor:pointer; font-weight:600; }
.alert { padding:10px 14px; border-radius:var(--radius-sm); font-size:.875rem; margin-bottom:12px; }
.alert-error { background:var(--red-50); color:var(--red-600); border:1px solid rgba(239,68,68,.15); }

/* ── Lists Screen ───────────────────────────────────────────────── */
.section { margin-bottom:24px; }
.section-title { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--gray-400); margin-bottom:10px; }
.list-grid { display:flex; flex-direction:column; gap:10px; }
.list-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; cursor:pointer; transition:all var(--ease); display:flex; align-items:center; gap:14px; border:1.5px solid transparent; }
.list-card:hover { box-shadow:var(--shadow-md); border-color:var(--amber-200); }
.list-card .list-icon { width:44px; height:44px; border-radius:var(--radius-sm); background:var(--amber-100); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
.list-card .list-info { flex:1; min-width:0; }
.list-card .list-name { font-weight:600; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-card .list-meta { font-size:.8rem; color:var(--gray-500); display:flex; gap:12px; margin-top:2px; }
.list-card .list-progress { font-size:.8rem; color:var(--amber-600); font-weight:600; white-space:nowrap; }
.empty-state { text-align:center; padding:40px 20px; color:var(--gray-400); }
.empty-state .empty-icon { font-size:2.5rem; margin-bottom:8px; display:block; }

/* ── Detail Screen ──────────────────────────────────────────────── */
.progress-strip { background:var(--gray-100); padding:10px 16px; display:flex; align-items:center; gap:12px; }
.progress-bar-track { flex:1; height:6px; background:var(--gray-200); border-radius:3px; overflow:hidden; }
.progress-bar-fill { height:100%; background:var(--green-500); border-radius:3px; transition:width .4s ease; }
.progress-text { font-size:.8rem; font-weight:600; color:var(--gray-600); white-space:nowrap; }
.add-form { display:flex; gap:8px; padding:16px; background:#fff; border-bottom:1px solid var(--gray-100); }
.add-form .input { flex:1; }
.add-form .qty-input { width:56px; text-align:center; flex:none; }
.item-section { padding:8px 16px 4px; }
.item-section-title { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--gray-400); padding:8px 0 4px; }
.item-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--gray-50); transition:background var(--ease); }
.item-row:last-child { border-bottom:none; }
.item-checkbox { width:22px; height:22px; border-radius:6px; border:2px solid var(--gray-300); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all var(--ease); flex-shrink:0; background:#fff; -webkit-appearance:none; appearance:none; }
.item-checkbox:checked { background:var(--green-500); border-color:var(--green-500); }
.item-checkbox:checked::after { content:''; display:block; width:6px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg) translateY(-1px); }
.item-name { flex:1; font-size:.95rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-name.checked { text-decoration:line-through; color:var(--gray-400); }
.item-qty { font-size:.75rem; font-weight:600; background:var(--gray-100); color:var(--gray-600); padding:2px 8px; border-radius:10px; white-space:nowrap; }
.item-delete { opacity:0; transition:opacity var(--ease); }
.item-row:hover .item-delete { opacity:1; }

/* ── Share Modal ────────────────────────────────────────────────── */
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn .2s ease; }
.modal { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:28px; max-width:360px; width:100%; text-align:center; animation:fadeIn .25s ease; }
.modal h2 { margin-bottom:4px; }
.modal .modal-desc { color:var(--gray-500); font-size:.9rem; margin-bottom:20px; }
.share-code { font-family:monospace; font-size:1.8rem; font-weight:700; letter-spacing:.2em; background:var(--amber-100); color:var(--amber-700); padding:14px 24px; border-radius:var(--radius-sm); margin-bottom:20px; display:block; user-select:all; }
.modal-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

/* ── Toasts ─────────────────────────────────────────────────────── */
.toast-area { position:fixed; top:12px; right:12px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:340px; }
.toast { padding:12px 16px; border-radius:var(--radius-sm); font-size:.875rem; font-weight:500; box-shadow:var(--shadow-md); animation:slideIn .3s ease; display:flex; align-items:center; gap:8px; }
.toast.removing { animation:slideOut .25s ease forwards; }
.toast-info { background:var(--amber-100); color:var(--amber-700); border:1px solid var(--amber-200); }
.toast-success { background:var(--green-50); color:var(--green-600); border:1px solid rgba(16,185,129,.2); }
.toast-error { background:var(--red-50); color:var(--red-600); border:1px solid rgba(239,68,68,.15); }

/* ── Responsive ─────────────────────────────────────────────────── */
@media (max-width:480px) {
  .appbar .user-email { display:none; }
  .item-delete { opacity:1; }
  .container { padding:12px; }
}
  </style>
</head>
<body>

<!-- Toast Area -->
<div class="toast-area" id="toastArea"></div>

<!-- Setup Screen -->
<div id="setupScreen" class="screen screen-center">
  <div class="card setup-card">
    <div class="icon">&#128722;</div>
    <h1>What to Buy</h1>
    <p>Shared shopping lists with real-time sync.<br>Set up the database to get started.</p>
    <button class="btn btn-primary btn-full" id="btnSetup">Set Up Database</button>
    <button class="btn btn-secondary btn-full" style="margin-top:8px" id="btnSkip">Skip &mdash; already set up</button>
    <div class="setup-log hidden" id="setupLog"></div>
  </div>
</div>

<!-- Auth Screen -->
<div id="authScreen" class="screen screen-center">
  <div class="card auth-card">
    <h1 id="authTitle">Welcome back</h1>
    <p class="subtitle" id="authSubtitle">Sign in to your account</p>
    <div class="alert alert-error hidden" id="authError"></div>
    <form class="auth-form" id="authForm">
      <input class="input" type="email" id="authEmail" placeholder="Email" required autocomplete="email">
      <input class="input" type="password" id="authPassword" placeholder="Password" required autocomplete="current-password" minlength="6">
      <button class="btn btn-primary btn-full" type="submit" id="authSubmit">Sign In</button>
    </form>
    <p class="auth-toggle">
      <span id="authToggleText">Don't have an account?</span>
      <a id="authToggleLink">Sign up</a>
    </p>
  </div>
</div>

<!-- Lists Screen -->
<div id="listsScreen" class="screen">
  <div class="appbar">
    <h1>What to Buy</h1>
    <span class="user-email" id="userEmail"></span>
    <button class="btn btn-ghost btn-icon" id="btnLogout" title="Log out">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
  <div class="container">
    <div class="section">
      <div class="input-row">
        <input class="input" id="newListName" placeholder="New list name..." maxlength="60">
        <button class="btn btn-primary" id="btnCreateList">Create</button>
      </div>
    </div>
    <div class="section">
      <div class="input-row">
        <input class="input" id="joinCode" placeholder="Enter share code..." maxlength="6" style="text-transform:uppercase;font-family:monospace;letter-spacing:.1em">
        <button class="btn btn-secondary" id="btnJoinList">Join</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">My Lists</div>
      <div class="list-grid" id="listGrid"></div>
    </div>
  </div>
</div>

<!-- Detail Screen -->
<div id="detailScreen" class="screen">
  <div class="appbar">
    <button class="btn btn-ghost btn-icon" id="btnBack" title="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 id="detailTitle">List</h1>
    <button class="btn btn-ghost btn-icon" id="btnShare" title="Share">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
    <button class="btn btn-danger btn-icon" id="btnDeleteList" title="Delete list">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
    </button>
  </div>
  <div class="progress-strip">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">0 / 0</span>
  </div>
  <form class="add-form" id="addForm">
    <input class="input" id="itemName" placeholder="Add an item..." maxlength="100" required>
    <input class="input qty-input" id="itemQty" placeholder="1" maxlength="6">
    <button class="btn btn-primary btn-icon" type="submit" title="Add">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </form>
  <div id="itemsContainer"></div>
</div>

<!-- Share Modal -->
<div class="modal-backdrop hidden" id="shareModal">
  <div class="modal">
    <h2>Share this list</h2>
    <p class="modal-desc">Give this code to anyone you want to share with</p>
    <span class="share-code" id="shareCode"></span>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnCopyCode">Copy Code</button>
      <button class="btn btn-secondary hidden" id="btnNativeShare">Share&hellip;</button>
      <button class="btn btn-ghost" id="btnCloseModal">Close</button>
    </div>
  </div>
</div>

<script>
(function() {
'use strict';

/* ── Config ─────────────────────────────────────────────────────── */
var API = '';  // same origin — served by pgStack proxy
var WS_BASE = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
var ANON_KEY = 'dev-only-anon-key-do-not-use-in-production';
var STORAGE_KEY = 'wtb-session';
var POLL_MS = 2000;

/* ── State ──────────────────────────────────────────────────────── */
var accessToken = '';
var refreshToken = '';
var user = null;
var currentListId = null;
var currentList = null;
var items = [];
var ws = null;
var pollTimer = null;
var suppressUntil = 0;

/* ── DOM refs ───────────────────────────────────────────────────── */
var $ = function(id) { return document.getElementById(id); };

/* ── Escape HTML — safe textContent-based escaping ──────────────── */
var _escDiv = document.createElement('div');
function esc(s) {
  _escDiv.textContent = s || '';
  return _escDiv.innerHTML;
}

/* ── Migration SQL ──────────────────────────────────────────────── */
var MIGRATION = [
  "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; END $$",
  "GRANT authenticated TO CURRENT_USER",
  "CREATE TABLE IF NOT EXISTS shopping_lists (id serial PRIMARY KEY, name text NOT NULL, owner_id uuid NOT NULL, share_code text UNIQUE, created_at timestamptz DEFAULT now())",
  "CREATE TABLE IF NOT EXISTS list_members (id serial PRIMARY KEY, list_id int REFERENCES shopping_lists(id) ON DELETE CASCADE, user_id uuid NOT NULL, role text NOT NULL DEFAULT 'member', joined_at timestamptz DEFAULT now(), UNIQUE(list_id, user_id))",
  "CREATE TABLE IF NOT EXISTS shopping_items (id serial PRIMARY KEY, list_id int REFERENCES shopping_lists(id) ON DELETE CASCADE, name text NOT NULL, quantity text DEFAULT '1', checked boolean DEFAULT false, added_by uuid, created_at timestamptz DEFAULT now())",
  "GRANT ALL ON shopping_lists TO authenticated",
  "GRANT USAGE, SELECT ON SEQUENCE shopping_lists_id_seq TO authenticated",
  "GRANT ALL ON list_members TO authenticated",
  "GRANT USAGE, SELECT ON SEQUENCE list_members_id_seq TO authenticated",
  "GRANT ALL ON shopping_items TO authenticated",
  "GRANT USAGE, SELECT ON SEQUENCE shopping_items_id_seq TO authenticated",
  "ALTER TABLE shopping_lists ENABLE ROW LEVEL SECURITY",
  "ALTER TABLE list_members ENABLE ROW LEVEL SECURITY",
  "ALTER TABLE shopping_items ENABLE ROW LEVEL SECURITY",
  "DROP POLICY IF EXISTS lists_select ON shopping_lists",
  "CREATE POLICY lists_select ON shopping_lists FOR SELECT TO authenticated USING (id IN (SELECT list_id FROM list_members WHERE user_id = (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid))",
  "DROP POLICY IF EXISTS lists_insert ON shopping_lists",
  "CREATE POLICY lists_insert ON shopping_lists FOR INSERT TO authenticated WITH CHECK (owner_id = (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid)",
  "DROP POLICY IF EXISTS lists_delete ON shopping_lists",
  "CREATE POLICY lists_delete ON shopping_lists FOR DELETE TO authenticated USING (owner_id = (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid)",
  "DROP POLICY IF EXISTS members_own ON list_members",
  "CREATE POLICY members_own ON list_members FOR ALL TO authenticated USING (user_id = (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid)",
  "DROP POLICY IF EXISTS items_access ON shopping_items",
  "CREATE POLICY items_access ON shopping_items FOR ALL TO authenticated USING (list_id IN (SELECT list_id FROM list_members WHERE user_id = (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid))",
  "DROP FUNCTION IF EXISTS create_shopping_list(text)",
  "CREATE OR REPLACE FUNCTION create_shopping_list(list_name text) RETURNS shopping_lists LANGUAGE plpgsql SECURITY DEFINER AS $fn$ DECLARE uid uuid := (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid; code text := upper(substr(md5(random()::text), 1, 6)); result shopping_lists; BEGIN INSERT INTO shopping_lists(name, owner_id, share_code) VALUES (list_name, uid, code) RETURNING * INTO result; INSERT INTO list_members(list_id, user_id, role) VALUES (result.id, uid, 'owner'); RETURN result; END; $fn$",
  "DROP FUNCTION IF EXISTS join_shopping_list(text)",
  "CREATE OR REPLACE FUNCTION join_shopping_list(code text) RETURNS shopping_lists LANGUAGE plpgsql SECURITY DEFINER AS $fn$ DECLARE uid uuid := (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid; lid int; result shopping_lists; BEGIN SELECT id INTO lid FROM shopping_lists WHERE upper(share_code) = upper(code); IF lid IS NULL THEN RAISE EXCEPTION 'Invalid share code'; END IF; INSERT INTO list_members(list_id, user_id, role) VALUES (lid, uid, 'member') ON CONFLICT (list_id, user_id) DO NOTHING; SELECT * INTO result FROM shopping_lists WHERE id = lid; RETURN result; END; $fn$",
  "DROP FUNCTION IF EXISTS my_shopping_lists()",
  "CREATE OR REPLACE FUNCTION my_shopping_lists() RETURNS TABLE(id int, name text, owner_id uuid, share_code text, created_at timestamptz, member_count bigint, item_count bigint, checked_count bigint) LANGUAGE plpgsql SECURITY DEFINER STABLE AS $fn$ DECLARE uid uuid := (current_setting('request.jwt.claims',true)::jsonb->>'sub')::uuid; BEGIN RETURN QUERY SELECT l.id, l.name, l.owner_id, l.share_code, l.created_at, (SELECT count(*) FROM list_members m WHERE m.list_id = l.id) AS member_count, (SELECT count(*) FROM shopping_items i WHERE i.list_id = l.id) AS item_count, (SELECT count(*) FROM shopping_items i WHERE i.list_id = l.id AND i.checked) AS checked_count FROM shopping_lists l JOIN list_members lm ON lm.list_id = l.id WHERE lm.user_id = uid ORDER BY l.created_at DESC; END; $fn$",
  "GRANT EXECUTE ON FUNCTION create_shopping_list(text) TO authenticated",
  "GRANT EXECUTE ON FUNCTION join_shopping_list(text) TO authenticated",
  "GRANT EXECUTE ON FUNCTION my_shopping_lists() TO authenticated"
];

/* ── HTTP helpers ───────────────────────────────────────────────── */
function hdrs(extra) {
  var h = { 'Content-Type': 'application/json', 'apikey': ANON_KEY };
  if (accessToken) h['Authorization'] = 'Bearer ' + accessToken;
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}

function apiSql(sql) {
  return fetch(API + '/api/sql', { method: 'POST', headers: hdrs(), body: JSON.stringify({ sql: sql }) })
    .then(function(r) { return r.json(); });
}

function apiRpc(fn, body) {
  return fetch(API + '/rest/v1/rpc/' + fn, { method: 'POST', headers: hdrs(), body: JSON.stringify(body || {}) })
    .then(handleAuth)
    .then(function(r) { return r.json(); });
}

function apiRest(method, path, body) {
  var opts = { method: method, headers: hdrs() };
  if (body) opts.body = JSON.stringify(body);
  return fetch(API + '/rest/v1/' + path, opts).then(handleAuth);
}

function handleAuth(r) {
  if (r.status === 401 && refreshToken) {
    return doRefresh().then(function() {
      return fetch(r.url, { method: 'GET', headers: hdrs() });
    });
  }
  return r;
}

function parseJwt(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
  catch(e) { return null; }
}

function getUserId() {
  var claims = parseJwt(accessToken);
  return claims ? claims.sub : null;
}

/* ── Session persistence ────────────────────────────────────────── */
function saveSession() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ accessToken: accessToken, refreshToken: refreshToken, user: user })); } catch(e) {}
}

function loadSession() {
  try {
    var s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && s.accessToken) {
      accessToken = s.accessToken;
      refreshToken = s.refreshToken || '';
      user = s.user || null;
      return true;
    }
  } catch(e) {}
  return false;
}

function clearSession() {
  accessToken = ''; refreshToken = ''; user = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

function doRefresh() {
  if (!refreshToken) return Promise.reject(new Error('No refresh token'));
  return fetch(API + '/auth/v1/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify({ grant_type: 'refresh_token', refresh_token: refreshToken })
  }).then(function(r) {
    if (!r.ok) { clearSession(); navigate('auth'); throw new Error('Session expired'); }
    return r.json();
  }).then(function(data) {
    accessToken = data.access_token;
    refreshToken = data.refresh_token;
    user = data.user || user;
    saveSession();
  });
}

/* ── Toast notifications ────────────────────────────────────────── */
function toast(msg, type) {
  var el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = msg;
  $('toastArea').appendChild(el);
  setTimeout(function() {
    el.classList.add('removing');
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
  }, 3200);
}

/* ── Router ─────────────────────────────────────────────────────── */
function navigate(screen, params) {
  location.hash = '#/' + screen + (params ? '/' + params : '');
}

function route() {
  var hash = location.hash || '#/setup';
  var parts = hash.replace('#/', '').split('/');
  var screen = parts[0] || 'setup';
  var param = parts[1] || null;

  if ((screen === 'lists' || screen === 'list') && !accessToken) {
    navigate('auth'); return;
  }

  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });

  switch (screen) {
    case 'setup': $('setupScreen').classList.add('active'); break;
    case 'auth': showAuth(); break;
    case 'lists': showLists(); break;
    case 'list':
      if (param) { currentListId = parseInt(param, 10); showDetail(); }
      else navigate('lists');
      break;
    default: $('setupScreen').classList.add('active');
  }
}

  log.textContent = '';

  var i = 0;
  function next() {
    if (i >= MIGRATION.length) {
      btn.textContent = 'Done!';
      btn.className = 'btn btn-secondary btn-full';
      toast('Database ready', 'success');
      setTimeout(function() { navigate('auth'); }, 600);
      return;
    }
    apiSql(MIGRATION[i]).then(function(res) {
      var line = document.createElement('div');
      if (res.error) {
        if (/already exists|duplicate/i.test(res.error)) {
          line.className = 'skip'; line.textContent = '[' + (i+1) + '/' + MIGRATION.length + '] skipped';
        } else {
          line.className = 'err'; line.textContent = '[' + (i+1) + '/' + MIGRATION.length + '] ' + res.error;
        }
      } else {
        line.className = 'ok'; line.textContent = '[' + (i+1) + '/' + MIGRATION.length + '] OK';
      }
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
      i++; next();
    }).catch(function(e) {
      var line = document.createElement('div');
      line.className = 'err'; line.textContent = '[' + (i+1) + '] Error: ' + e.message;
      log.appendChild(line);
      i++; next();
    });
  }
  next();
});

    ? { email: email, password: password }
    : { grant_type: 'password', email: email, password: password };

    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })

      toast(authMode === 'signup' ? 'Account created!' : 'Welcome back!', 'success');
      navigate('lists');

function showDetail() {
  $('detailScreen').classList.add('active');
  $('detailTitle').textContent = 'Loading...';
  items = [];
  renderItems();

  apiRpc('my_shopping_lists').then(function(data) {
    var arr = Array.isArray(data) ? data : [];
    currentList = null;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === currentListId) { currentList = arr[i]; break; }
    }
    if (!currentList) { toast('List not found', 'error'); navigate('lists'); return; }
    $('detailTitle').textContent = currentList.name;
    loadItems();
    startRealtime();
  });
}

function loadItems() {
  return apiRest('GET', 'shopping_items?list_id=eq.' + currentListId + '&order=checked.asc,created_at.desc')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      items = Array.isArray(data) ? data : [];
      renderItems();
    });
}

function renderItems() {
  var unchecked = items.filter(function(i) { return !i.checked; });
  var checked = items.filter(function(i) { return i.checked; });
  var total = items.length;
  var done = checked.length;

  var pct = total > 0 ? (done / total * 100) : 0;
  $('progressFill').style.width = pct + '%';
  $('progressFill').style.background = pct === 100 ? 'var(--green-500)' : 'var(--amber-500)';
  $('progressText').textContent = done + ' / ' + total;

  var container = $('itemsContainer');
  container.textContent = '';

  if (total === 0) {
    var empty = document.createElement('div'); empty.className = 'empty-state';
    var ico = document.createElement('span'); ico.className = 'empty-icon'; ico.textContent = '\uD83C\uDF0E';
    empty.appendChild(ico);
    empty.appendChild(document.createTextNode('No items yet.'));
    empty.appendChild(document.createElement('br'));
    empty.appendChild(document.createTextNode('Add something above!'));
    container.appendChild(empty);
    return;
  }

  if (unchecked.length > 0) {
    container.appendChild(buildItemSection('To buy (' + unchecked.length + ')', unchecked));
  }
  if (checked.length > 0) {
    container.appendChild(buildItemSection('In cart (' + checked.length + ')', checked));
  }
}

function buildItemSection(title, itemList) {
  var section = document.createElement('div'); section.className = 'item-section';
  var titleEl = document.createElement('div'); titleEl.className = 'item-section-title';
  titleEl.textContent = title;
  section.appendChild(titleEl);

  itemList.forEach(function(item) {
    var row = document.createElement('div'); row.className = 'item-row';

    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'item-checkbox'; cb.checked = item.checked;

    var nameSpan = document.createElement('span');
    nameSpan.className = 'item-name' + (item.checked ? ' checked' : '');
    nameSpan.textContent = item.name;

    row.appendChild(cb); row.appendChild(nameSpan);

    if (item.quantity && item.quantity !== '1') {
      var qtySpan = document.createElement('span'); qtySpan.className = 'item-qty';
      qtySpan.textContent = item.quantity;
      row.appendChild(qtySpan);
    }

    var delBtn = document.createElement('button');
    delBtn.className = 'btn btn-ghost btn-icon item-delete'; delBtn.title = 'Delete';
    delBtn.insertAdjacentHTML('afterbegin',
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>');
    row.appendChild(delBtn);

    // Bind events
    var itemId = item.id;
    cb.addEventListener('change', function() {
      var newChecked = cb.checked;
      suppressUntil = Date.now() + 3000;
      for (var k = 0; k < items.length; k++) {
        if (items[k].id === itemId) { items[k].checked = newChecked; break; }
      }
      renderItems();
      apiRest('PATCH', 'shopping_items?id=eq.' + itemId, { checked: newChecked }).catch(function() {
        for (var k = 0; k < items.length; k++) {
          if (items[k].id === itemId) { items[k].checked = !newChecked; break; }
        }
        renderItems();
        toast('Failed to update', 'error');
      });
    });

    delBtn.addEventListener('click', function() {
      suppressUntil = Date.now() + 3000;
      items = items.filter(function(it) { return it.id !== itemId; });
      renderItems();
      apiRest('DELETE', 'shopping_items?id=eq.' + itemId).catch(function() {
        loadItems(); toast('Failed to delete', 'error');
      });
    });

    section.appendChild(row);
  });
  return section;
}

$('addForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var name = $('itemName').value.trim();
  if (!name) return;
  var qty = $('itemQty').value.trim() || '1';
  $('itemName').value = '';

/* ── Real-time updates ──────────────────────────────────────────── */
function startRealtime() {
  cleanupDetail();
  pollTimer = setInterval(function() { loadItems(); }, POLL_MS);

  try {
    var wsUrl = WS_BASE + '/ws/items-' + currentListId + '?token=' + encodeURIComponent(accessToken);
    ws = new WebSocket(wsUrl);
    ws.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'subscribed') return;
        if (msg.type === 'overflow') { loadItems(); return; }
        if (msg.inserted || msg.deleted) applyDelta(msg);
      } catch(err) {}
    };
    ws.onopen = function() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      pollTimer = setInterval(function() { loadItems(); }, 10000);
    };
  } catch(err) {}
}

function applyDelta(msg) {
  var insertedIds = {};
  var changed = false;
  var selfAction = Date.now() < suppressUntil;

  if (msg.inserted && msg.inserted.length) {
    for (var i = 0; i < msg.inserted.length; i++) {
      var row = msg.inserted[i];
      insertedIds[row.id] = true;
      var found = false;
      for (var j = 0; j < items.length; j++) {
        if (items[j].id === row.id) { items[j] = row; found = true; break; }
      }
      if (!found) {
        items.unshift(row);
        if (!selfAction) toast(row.name + ' added', 'info');
      }
      changed = true;
    }
  }

  if (msg.deleted && msg.deleted.length) {
    var deleteIds = [];
    for (var k = 0; k < msg.deleted.length; k++) {
      if (!insertedIds[msg.deleted[k].id]) deleteIds.push(msg.deleted[k].id);
    }
    if (deleteIds.length > 0) {
      var delSet = {};
      for (var d = 0; d < deleteIds.length; d++) delSet[deleteIds[d]] = true;
      items = items.filter(function(it) { return !delSet[it.id]; });
      changed = true;
    }
  }

  if (changed) renderItems();
}

function cleanupDetail() {
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
