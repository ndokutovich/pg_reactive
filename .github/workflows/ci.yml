name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─── Extension tests (pg_regress + isolation) ───────────────────────────────
  test-extension:
    name: Extension tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL container
        run: |
          docker compose up -d --build db
          docker compose exec -T db bash -c 'until pg_isready -U postgres; do sleep 1; done'

      - name: Build extension
        run: |
          docker compose exec -T db bash -c \
            'cd /ext/ext && make clean && make && make install'

      - name: pg_regress tests
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "cd /ext/ext && make installcheck"'

      - name: Isolation tests
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "cd /ext/ext && make isolation_installcheck"'

      # Round 37 F2: the main server runs max_prepared_transactions=0, so the
      # PREPARE-rejection guard can't be exercised by pg_regress. This spins a
      # throwaway 2PC-enabled instance and asserts PREPARE-after-subscribe is
      # rejected (with catalog+shmem rollback) while a clean txn still prepares.
      - name: 2PC PREPARE guard test
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "bash /ext/tests/ext_prepare_guard_test.sh"'

      - name: Upload regression diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs
          path: |
            ext/regression.diffs
            ext/regression.out

  # ─── Rust proxy ─────────────────────────────────────────────────────────────
  # Released artifact gate. The published proxy in
  # examples/docker-compose.prod.yml and release.yml is `proxy-go`;
  # security CI MUST block on this job, not on test-proxy (Rust).
  # Audit round 32 F1.
  test-proxy-go:
    name: Proxy (Go)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache-dependency-path: proxy-go/go.sum

      - name: Build
        working-directory: proxy-go
        run: go build ./...

      - name: Vet
        working-directory: proxy-go
        run: go vet ./...

      - name: Unit tests
        working-directory: proxy-go
        run: go test -count=1 ./...

      - name: Vulnerability scan (govulncheck)
        working-directory: proxy-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Reference implementation. Kept building so the Rust proxy doesn't
  # bit-rot, but it is NOT a release gate — security/prod-validator
  # depend on test-proxy-go above.
  test-proxy:
    name: Proxy (Rust, reference)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            proxy/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('proxy/Cargo.lock') }}

      - name: Clippy
        working-directory: proxy
        run: cargo clippy -- -D warnings

      - name: Format check
        working-directory: proxy
        run: cargo fmt --check

      - name: Build
        working-directory: proxy
        run: cargo build --release

      - name: Unit tests
        working-directory: proxy
        run: cargo test

  # ─── TypeScript SDK ──────────────────────────────────────────────────────────
  test-sdk:
    name: SDK (TypeScript)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Start PostgreSQL for integration tests
        run: |
          docker compose up -d --build db
          docker compose exec -T db bash -c 'until pg_isready -U postgres; do sleep 1; done'
          # Self-hosted: join the compose network so the runner can reach
          # `db:5432` directly without going through host port mapping
          # (which 127.0.0.1 in this container can't see).
          docker network connect "${COMPOSE_PROJECT_NAME:-pg_reactive}_default" "$(hostname)" || true

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Type check
        working-directory: sdk
        run: npx tsc --noEmit

      - name: Tests
        working-directory: sdk
        env:
          PG_HOST: db
          PG_TEST_PORT: "5432"
        run: npm test

      - name: Build
        working-directory: sdk
        run: npm run build

  # ─── CLI ────────────────────────────────────────────────────────────────────
  test-cli:
    name: CLI (TypeScript)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Type check
        working-directory: cli
        run: npx tsc --noEmit

      - name: Tests
        working-directory: cli
        run: npm test

      - name: Build
        working-directory: cli
        run: npm run build

      # Audit round 26 F2: published cli/dist must match a fresh build of
      # cli/src. Otherwise a hardened source change (e.g. removing blanket
      # GRANTs from the generated bootstrap migration) can sit in the
      # repo while the published bin runs stale insecure JS.
      - name: cli/dist parity (rebuild must produce no diff)
        working-directory: cli
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::cli/dist is out of date — run 'npm run build' inside cli/ and commit the result."
            exit 1
          fi

      # Round-31 Tier 2.3: cli/templates/bootstrap-core.sql is generated
      # from docker/init.sql (BEGIN/END-PGSTACK-CORE region). Drift =
      # round-12 / round-28 footguns silently regress in the CLI bootstrap.
      - name: cli/templates/bootstrap-core.sql parity (re-sync must produce no diff)
        run: |
          node scripts/sync-cli-bootstrap.mjs
          if ! git diff --exit-code cli/templates/bootstrap-core.sql; then
            echo "::error::cli/templates/bootstrap-core.sql is out of date — run 'node scripts/sync-cli-bootstrap.mjs' and commit the result."
            exit 1
          fi

      # Docs reorg: the standalone pg_reactive extension docset must not drift
      # from the C source of truth. check-docs-parity asserts every GUC
      # registered in ext/src/*.c is documented in docs/site/pg-reactive/gucs.md,
      # and the NOTIFY wire contract appears in pg-reactive/wire-format.md.
      - name: pg_reactive docs parity (GUCs + wire format)
        run: node scripts/check-docs-parity.mjs

      # A page served by the proxy PublicSPA catch-all (public/index.html) for
      # any unmatched depth must use root-absolute asset paths — a relative
      # href="style.css" resolves to /docs/intro/style.css, which the catch-all
      # answers with index.html (text/html) and the browser rejects the CSS.
      - name: Static asset path guard
        run: node tests/static_asset_paths_test.mjs

  # ─── Adversarial security fixtures ──────────────────────────────────────────
  # Round-31 Tier 3.5: negative tests in tests/security/ assert that
  # specific attacks are refused. Each prior audit finding leaves one
  # such test behind, per the SECURITY.md ritual.
  test-security:
    name: Adversarial security
    runs-on: [self-hosted, Linux, X64]
    needs: [test-proxy-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Round 32 F2: REQUIRE_AUTHENTICATED_WS=true is what makes the
      # ws__anon_refused_when_required test actually exercise the
      # anon-key bypass gate. Without it the test would only cover
      # the "no token at all" path, which is the trivial reject.
      - name: Bring up stack (REQUIRE_AUTHENTICATED_WS=true)
        run: |
          REQUIRE_AUTHENTICATED_WS=true docker compose up -d --build
          # Health-check from inside the proxy-go container — works regardless
          # of host port mapping (self-hosted runner can't see 127.0.0.1:8080
          # on the daemon host).
          timeout 120 bash -c 'until docker compose exec -T proxy-go curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 2; done'
          # Self-hosted: join the compose network so this runner can
          # address the proxy by service name on later steps.
          docker network connect "${COMPOSE_PROJECT_NAME:-pg_reactive}_default" "$(hostname)" || true

      - name: Install ws (needed by anon-WS test)
        run: cd tests && npm install ws

      - name: Static lint for unsafe SQL / Markdown patterns
        run: node tests/lint/security_patterns.mjs

      - name: Run adversarial fixtures
        env:
          # Address proxy-go by its compose service name — the runner was
          # joined to the network in the Bring-up step. This avoids the
          # 127.0.0.1 vs published-port pitfall on self-hosted.
          PROXY_URL: http://proxy-go:8080
          BASE_URL: http://proxy-go:8080
          # Every secret here must match the dev-compose default the
          # proxy was started with (docker-compose.yml). Otherwise
          # tests that mint a "valid" token (auth__jwt_manipulation
          # baseline) sign with the wrong key and the proxy correctly
          # 401s — making the test look broken when the gate is fine.
          # Round 33 follow-up.
          JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
          ANON_KEY: dev-only-anon-key-do-not-use-in-production
          SERVICE_ROLE_KEY: dev-only-service-role-key-do-not-use-in-production
          # Surface to the test so it asserts the right outcome — the
          # proxy was started with this flag above; the test reads it
          # from its own env to decide expected pass condition.
          REQUIRE_AUTHENTICATED_WS: "true"
        run: |
          set -e
          for t in tests/security/*.test.mjs; do
            echo ""
            echo "=== $t ==="
            node "$t"
          done

      - name: Run doc-SQL smoke
        run: node tests/doc_sql_smoke_test.mjs

  # ─── Production-mode validator E2E ──────────────────────────────────────────
  # Round-31 Tier 2.4: the default E2E job runs in dev mode. This job
  # boots the proxy with PGSTACK_ENV=production and asserts the strict
  # validator refuses placeholder secrets / dev flags / SMTP-fail-closed
  # mailer / etc. without us having to wait for someone to actually
  # deploy to a public VPS to discover the prod posture is broken.
  test-prod-validator:
    name: Production validator
    runs-on: [self-hosted, Linux, X64]
    needs: [test-proxy-go]
    steps:
      - uses: actions/checkout@v4

      # Round 32 F1: build the GO proxy (the one actually shipped via
      # release.yml + examples/docker-compose.prod.yml). The earlier
      # `compose build proxy` built the Rust reference impl, which made
      # this whole job a non-gate for the released artifact.
      - name: Build proxy-go image
        run: docker compose build proxy-go

      - name: Refuses on placeholder JWT_SECRET
        run: |
          set +e
          out=$(docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET=dev-only-jwt-secret-do-not-use-in-production \
            -e ANON_KEY=$(openssl rand -base64 32) \
            -e SERVICE_ROLE_KEY=$(openssl rand -base64 32) \
            -e SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=u -e SMTP_PASS=p \
            proxy-go 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::production validator accepted a dev-only-* JWT_SECRET"
            exit 1
          fi
          echo "✓ refused dev-only JWT_SECRET"

      - name: Refuses on missing SMTP
        run: |
          set +e
          out=$(docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET=$(openssl rand -base64 32) \
            -e ANON_KEY=$(openssl rand -base64 32) \
            -e SERVICE_ROLE_KEY=$(openssl rand -base64 32) \
            -e SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            proxy-go 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::production validator accepted missing SMTP_HOST/USER/PASS"
            exit 1
          fi
          echo "✓ refused missing SMTP in production"

      # Round 32 F4 (revised round 33): the previous version backgrounded
      # `docker compose run` and racily captured its stdout, which lost
      # the "pgstack listening" line on CI. Switch to a foreground run
      # under `timeout`: validator failures exit fast with a
      # "configuration errors" line, valid env reaches the listen loop
      # and `timeout` SIGTERMs after 10s. Either way we capture full
      # output reliably.
      - name: Accepts a fully-configured production environment
        run: |
          set +e
          # Bring up the db so the validator's downstream pool probe
          # doesn't masquerade as a validator failure.
          docker compose up -d --build db
          docker compose exec -T db bash -c 'until pg_isready -U postgres; do sleep 1; done'

          # The dev docker-compose.yml sets ENABLE_SQL_ENDPOINT=true
          # so the e2e suite can use the raw SQL gateway. The
          # production validator correctly refuses to boot with that
          # flag — so the positive-case run must EXPLICITLY override
          # it (and any other dev-only flag the validator rejects)
          # to false. Otherwise this step keeps catching the
          # validator's own dev-vs-prod machinery, not a regression.
          out=$(timeout 15 docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET=$(openssl rand -base64 32) \
            -e ANON_KEY=$(openssl rand -base64 32) \
            -e SERVICE_ROLE_KEY=$(openssl rand -base64 32) \
            -e SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=u -e SMTP_PASS=p \
            -e ALLOWED_ORIGINS=https://example.com \
            -e REQUIRE_AUTHENTICATED_WS=true \
            -e ENABLE_SQL_ENDPOINT=false \
            -e ENABLE_DEMO_ENDPOINT=false \
            -e ALLOW_PERMISSIVE_CORS=false \
            -e TLS_MODE=off \
            proxy-go 2>&1)
          echo "$out"

          if echo "$out" | grep -q "configuration errors"; then
            echo "::error::production validator REJECTED a valid production env"
            exit 1
          fi
          if echo "$out" | grep -q "pgstack listening"; then
            echo "✓ production validator accepted a fully-configured env (proxy started listening)"
            exit 0
          fi
          # If we got neither: the proxy died before logging "listening"
          # AND without a "configuration errors" line. That's a
          # different kind of failure — surface it.
          echo "::error::neither 'configuration errors' nor 'pgstack listening' appeared; investigate"
          exit 1

  # ─── E2E tests (full stack) ──────────────────────────────────────────────────
  test-e2e:
    name: E2E tests
    runs-on: [self-hosted, Linux, X64]
    needs: [test-extension, test-proxy-go, test-sdk]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start full stack
        run: |
          docker compose up -d --build
          echo "Waiting for stack to be healthy..."
          # Self-hosted: health-check via compose exec (127.0.0.1 inside
          # this runner doesn't see the daemon-host's published ports).
          timeout 120 bash -c 'until docker compose exec -T proxy-go curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 2; done'
          docker network connect "${COMPOSE_PROJECT_NAME:-pg_reactive}_default" "$(hostname)" || true
          # E2E test files hardcode 127.0.0.1:8080 and 127.0.0.1:15432.
          # socat forwards those to the compose service names so the
          # tests run unchanged.
          which socat >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y socat)
          socat TCP-LISTEN:8080,fork,reuseaddr TCP:proxy-go:8080 &
          socat TCP-LISTEN:15432,fork,reuseaddr TCP:db:5432 &
          sleep 1
          echo "Stack ready"

      - name: E2E — WebSocket
        run: node tests/e2e_ws_test.mjs

      - name: E2E — Fan-out
        run: node tests/e2e_fanout_test.mjs

      - name: E2E — JWT auth
        run: node tests/e2e_jwt_test.mjs

      - name: E2E — Auth endpoints
        run: node tests/e2e_auth_test.mjs

      - name: E2E — REST CRUD
        run: node tests/e2e_rest_test.mjs

      - name: E2E — RLS middleware
        run: node tests/e2e_rls_test.mjs

      - name: E2E — RPC
        run: node tests/e2e_rpc_test.mjs

      - name: E2E — Resource embedding
        run: node tests/e2e_embed_test.mjs

      - name: E2E — OAuth flow
        run: node tests/e2e_oauth_test.mjs

      - name: E2E — SDK integration
        run: node tests/e2e_sdk_test.mjs

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > docker-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

  # ─── Integration tests ───────────────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: [self-hosted, Linux, X64]
    needs: [test-extension]
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL container
        run: |
          docker compose up -d --build db
          # The dev image compiles the extension in its entrypoint before
          # PostgreSQL starts; a cold compile + initdb + bootstrap can take
          # ~40s, so allow generous headroom (was 30s, which it now exceeds).
          timeout 120 bash -c 'until docker compose exec -T db pg_isready -U postgres; do sleep 1; done'

      - name: Shared memory pressure test
        run: |
          docker compose exec -T db bash -c \
            'cd /ext && python3 tests/integration/test_shmem_pressure.py'

      - name: NOTIFY throughput test
        run: |
          docker compose exec -T db bash -c \
            'cd /ext && python3 tests/integration/test_notify_throughput.py'

  # ─── Security audit ──────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --omit=dev limits the audit to runtime dependencies. Dev-only chains
      # (vite, vitest, stryker, postcss, ...) ship vulns of their own that
      # don't reach end users of the SDK/CLI — auditing them blocks CI on
      # toolchain churn rather than real consumer risk.
      - name: npm audit — SDK
        working-directory: sdk
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit — CLI
        working-directory: cli
        run: npm audit --audit-level=high --omit=dev

      # Round 37 F4: the docs site was previously unaudited. Its dependency tree
      # pulls webpack-dev-server (a build/dev-server-only chain that never lands
      # in the static output or the proxy-go runtime image), so the residual
      # MODERATE advisories there are toolchain risk, not consumer risk — hence
      # --audit-level=high, matching SDK/CLI. The one CRITICAL (shell-quote
      # GHSA-w7jw-789q-3m8p) is pinned to the patched ^1.8.4 via an override in
      # docs/site/package.json, so this gate stays meaningful instead of being
      # permanently red on an unshipped dev-server transitive.
      - name: npm audit — Docs site
        working-directory: docs/site
        run: npm audit --audit-level=high --omit=dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: cargo audit
        working-directory: proxy
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit
