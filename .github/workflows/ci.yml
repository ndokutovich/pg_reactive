name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# Least-privilege default GITHUB_TOKEN: read-only contents for every job (a job
# that needs more, e.g. packages: write, opts in locally). Untrusted PR code thus
# cannot use the token to write to the repo (gemini audit R17-5).
permissions:
  contents: read

# Runner policy (gemini audit finding 3): PR-triggered runs execute UNTRUSTED
# code, so they must NOT land on the self-hosted runner that also runs deploy/
# release — a malicious PR could otherwise persist on the box and steal
# publish/VPS credentials from a later trusted run. Every job below selects its
# runner via `github.event_name`: `pull_request` -> ephemeral GitHub-hosted
# (fresh VM, destroyed after the job); `push`/`workflow_dispatch` (trusted) ->
# the self-hosted runner. deploy.yml / release.yml never trigger on PRs.
jobs:
  # ─── Extension tests (pg_regress + isolation) ───────────────────────────────
  test-extension:
    name: Extension tests
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Start PostgreSQL container
        run: |
          docker compose up -d --build db
          docker compose exec -T db bash -c 'until pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'

      - name: Build extension
        run: |
          docker compose exec -T db bash -c \
            'cd /ext/ext && make clean && make && make install'

      - name: pg_regress tests
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "cd /ext/ext && make installcheck"'

      - name: Isolation tests
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "cd /ext/ext && make isolation_installcheck"'

      # Round 37 F2: the main server runs max_prepared_transactions=0, so the
      # PREPARE-rejection guard can't be exercised by pg_regress. This spins a
      # throwaway 2PC-enabled instance and asserts PREPARE-after-subscribe is
      # rejected (with catalog+shmem rollback) while a clean txn still prepares.
      - name: 2PC PREPARE guard test
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "bash /ext/tests/ext_prepare_guard_test.sh"'

      - name: Upload regression diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-diffs
          path: |
            ext/regression.diffs
            ext/regression.out

  # ─── Sibling proxies (Go + Rust, co-equal) ─────────────────────────────────
  # Both proxies are first-class and security-hardened to parity; BOTH gate the
  # release candidate (build-publish-images needs both). The currently published
  # image is `pgstack-proxy` (Go); the Rust image is the remaining release-infra
  # step. (Round 32 F1 originally gated only on Go while Rust was a reference;
  # Rust is now a sibling and a release gate.)
  test-proxy-go:
    name: Proxy (Go)
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: proxy-go/go.sum

      - name: Build
        working-directory: proxy-go
        run: go build ./...

      - name: Vet
        working-directory: proxy-go
        run: go vet ./...

      - name: Unit tests
        working-directory: proxy-go
        run: go test -count=1 ./...

      - name: Vulnerability scan (govulncheck)
        working-directory: proxy-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Co-equal sibling proxy (Rust). A release gate alongside the Go proxy:
  # build-publish-images needs this job too, so a broken Rust proxy blocks the
  # release. clippy -D warnings, fmt --check, build, and unit tests.
  test-proxy:
    name: Proxy (Rust)
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: "1.88"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            proxy/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('proxy/Cargo.lock') }}

      - name: Clippy
        working-directory: proxy
        # --all-targets lints test/example code too (where uninlined_format_args
        # debt accumulated unseen by the bin-only command); --all-features keeps
        # the gate matching the strict local command CLAUDE.md claims passes.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        working-directory: proxy
        run: cargo fmt --check

      - name: Build
        working-directory: proxy
        run: cargo build --release

      - name: Unit tests
        working-directory: proxy
        run: cargo test

  # ─── TypeScript SDK ──────────────────────────────────────────────────────────
  test-sdk:
    name: SDK (TypeScript)
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Start PostgreSQL for integration tests
        run: |
          docker compose up -d --build db
          docker compose exec -T db bash -c 'until pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'
          # Self-hosted: join the compose network so the runner can reach
          # `db:5432` directly without going through host port mapping
          # (which 127.0.0.1 in this container can't see).
          docker network connect "${COMPOSE_PROJECT_NAME:-pg_reactive}_default" "$(hostname)" || true

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Type check
        working-directory: sdk
        run: npx tsc --noEmit

      - name: Tests
        working-directory: sdk
        env:
          PG_HOST: db
          PG_TEST_PORT: "5432"
        run: npm test

      - name: Build
        working-directory: sdk
        run: npm run build

  # ─── CLI ────────────────────────────────────────────────────────────────────
  test-cli:
    name: CLI (TypeScript)
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Type check
        working-directory: cli
        run: npx tsc --noEmit

      - name: Tests
        working-directory: cli
        run: npm test

      - name: Build
        working-directory: cli
        run: npm run build

      # Audit round 26 F2: published cli/dist must match a fresh build of
      # cli/src. Otherwise a hardened source change (e.g. removing blanket
      # GRANTs from the generated bootstrap migration) can sit in the
      # repo while the published bin runs stale insecure JS.
      - name: cli/dist parity (rebuild must produce no diff)
        working-directory: cli
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::cli/dist is out of date — run 'npm run build' inside cli/ and commit the result."
            exit 1
          fi

      # Round-31 Tier 2.3: cli/templates/bootstrap-core.sql is generated
      # from docker/init.sql (BEGIN/END-PGSTACK-CORE region). Drift =
      # round-12 / round-28 footguns silently regress in the CLI bootstrap.
      - name: cli/templates/bootstrap-core.sql parity (re-sync must produce no diff)
        run: |
          node scripts/sync-cli-bootstrap.mjs
          if ! git diff --exit-code cli/templates/bootstrap-core.sql; then
            echo "::error::cli/templates/bootstrap-core.sql is out of date — run 'node scripts/sync-cli-bootstrap.mjs' and commit the result."
            exit 1
          fi

      # Docs reorg: the standalone pg_reactive extension docset must not drift
      # from the C source of truth. check-docs-parity asserts every GUC
      # registered in ext/src/*.c is documented in docs/site/pg-reactive/gucs.md,
      # and the NOTIFY wire contract appears in pg-reactive/wire-format.md.
      - name: pg_reactive docs parity (GUCs + wire format)
        run: node scripts/check-docs-parity.mjs

      # A page served by the proxy PublicSPA catch-all (public/index.html) for
      # any unmatched depth must use root-absolute asset paths — a relative
      # href="style.css" resolves to /docs/intro/style.css, which the catch-all
      # answers with index.html (text/html) and the browser rejects the CSS.
      - name: Static asset path guard
        run: node tests/static_asset_paths_test.mjs

      # Round 39: the repo is PostgreSQL (ext/) + Apache-2.0 — never MIT/GPL.
      # Stale "MIT licensed" copy kept resurfacing in landing drafts, a report,
      # a roadmap note and a spec table; this fails on any stray MIT/GPL token
      # in project files (third-party attributions in NOTICE are allow-listed).
      - name: License consistency guard
        run: node tests/license_consistency_test.mjs

      # The supply-chain guard parses workflow YAML with js-yaml (tests/package.json).
      # Lockfile-strict (npm ci) so a tampered dep tree fails rather than resolving.
      - name: Install tests/ deps (js-yaml for the supply-chain guard)
        run: npm ci --prefix tests

      # Locks the deploy/release supply-chain hardening (gemini R3-R7): the
      # workflow_run deploy gate, release ci-gate, and action SHA-pinning.
      - name: CI/CD supply-chain gating guard (FR-B.11.3)
        run: node tests/ci_supply_chain_test.mjs

      # R27: the critical gate/validation logic lives in .github/scripts/*.sh,
      # tested by EXECUTION here (the guard above only checks the workflows CALL
      # them and don't disable the step). Needs bash (present on the runner).
      - name: Release/deploy gate scripts (executed)
        run: node tests/release_scripts_test.mjs

      # project-trace: docs/traceability.yaml maps every spec FR (pg_reactive_spec
      # + postgres_native_backend_spec) to code symbols + tests. The gate fails if
      # any FR regresses below the pinned floor in docs/traceability.baseline.json.
      # Intentional downgrades: re-pin via `python scripts/check-traceability.py
      # --write-baseline` and commit the baseline.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Traceability gate (spec → code → tests)
        run: python3 scripts/check-traceability.py

  # ─── Adversarial security fixtures ──────────────────────────────────────────
  # Round-31 Tier 3.5: negative tests in tests/security/ assert that
  # specific attacks are refused. Each prior audit finding leaves one
  # such test behind, per the SECURITY.md ritual.
  test-security:
    name: Adversarial security
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    needs: [test-proxy-go]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Round 32 F2: REQUIRE_AUTHENTICATED_WS=true is what makes the
      # ws__anon_refused_when_required test actually exercise the
      # anon-key bypass gate. Without it the test would only cover
      # the "no token at all" path, which is the trivial reject.
      - name: Bring up stack (REQUIRE_AUTHENTICATED_WS=true)
        run: |
          REQUIRE_AUTHENTICATED_WS=true ALLOW_ANONYMOUS_SIGNIN=true docker compose up -d --build
          # Health-check from inside the proxy-go container — works regardless
          # of host port mapping (self-hosted runner can't see 127.0.0.1:8080
          # on the daemon host).
          timeout 120 bash -c 'until docker compose exec -T proxy-go curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 2; done'
          # Self-hosted: join the compose network so this runner can
          # address the proxy by service name on later steps.
          docker network connect "${COMPOSE_PROJECT_NAME:-pg_reactive}_default" "$(hostname)" || true

      - name: Install ws (needed by anon-WS test)
        run: npm ci --prefix tests

      - name: Static lint for unsafe SQL / Markdown patterns
        run: node tests/lint/security_patterns.mjs

      # 0.3.0: the anonymous-signin gate-on test writes a real row and needs a
      # database, so it self-skips without PGSTACK_TEST_DSN. Run it HERE, where
      # the compose stack is already up — otherwise it is permanently skipped
      # and the endpoint's row/claim/rotation behavior is untested.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: proxy-go/go.sum

      - name: Anonymous signin gate-on (real DB row + claim + rotation)
        working-directory: proxy-go
        run: |
          DSN="postgres://postgres:postgres@127.0.0.1:15432/pg_reactive_test"
          # Self-hosted runners cannot see published ports on the daemon host;
          # they were joined to the compose network above — use the service name.
          if ! (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null; then
            DSN="postgres://postgres:postgres@db:5432/pg_reactive_test"
          fi
          PGSTACK_TEST_DSN="$DSN" go test -count=1 -run TestAnonymous -v ./auth/

      - name: Run adversarial fixtures
        env:
          # Address proxy-go by its compose service name — the runner was
          # joined to the network in the Bring-up step. This avoids the
          # 127.0.0.1 vs published-port pitfall on self-hosted.
          PROXY_URL: http://proxy-go:8080
          BASE_URL: http://proxy-go:8080
          # Every secret here must match the dev-compose default the
          # proxy was started with (docker-compose.yml). Otherwise
          # tests that mint a "valid" token (auth__jwt_manipulation
          # baseline) sign with the wrong key and the proxy correctly
          # 401s — making the test look broken when the gate is fine.
          # Round 33 follow-up.
          JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
          ANON_KEY: dev-only-anon-key-do-not-use-in-production
          SERVICE_ROLE_KEY: dev-only-service-role-key-do-not-use-in-production
          # Surface to the test so it asserts the right outcome — the
          # proxy was started with this flag above; the test reads it
          # from its own env to decide expected pass condition.
          REQUIRE_AUTHENTICATED_WS: "true"
          # 0.3.0: the stack above is brought up with guest signin enabled;
          # the anonymous suites read this to run their gate-on battery.
          ALLOW_ANONYMOUS_SIGNIN: "true"
        run: |
          set -e
          for t in tests/security/*.test.mjs; do
            echo ""
            echo "=== $t ==="
            node "$t"
          done

      # 0.3.0 trust-model changes must hold on BOTH proxies (CLAUDE.md). The
      # full suite historically ran against :8081 manually at parity passes;
      # the anonymous-identity suites are cheap enough to pin in CI forever.
      - name: Anonymous identity fixtures against the Rust sibling
        env:
          PROXY_URL: http://proxy:8080
          BASE_URL: http://proxy:8080
          JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
          ANON_KEY: dev-only-anon-key-do-not-use-in-production
          SERVICE_ROLE_KEY: dev-only-service-role-key-do-not-use-in-production
          REQUIRE_AUTHENTICATED_WS: "true"
          ALLOW_ANONYMOUS_SIGNIN: "true"
        run: |
          set -e
          # The Rust runtime image is distroless-ish (no curl/wget) — probe
          # from the RUNNER over the compose network it joined at bring-up,
          # exactly how the tests below will connect.
          timeout 180 bash -c 'until curl -sf http://proxy:8080/health >/dev/null 2>&1; do sleep 2; done'
          node tests/security/auth__anonymous_role_isolation.test.mjs
          node tests/security/auth__anonymous_upgrade.test.mjs
          node tests/security/ws__anon_refused_when_required.test.mjs

      - name: Run doc-SQL smoke
        run: node tests/doc_sql_smoke_test.mjs

  # ─── Production-mode validator E2E ──────────────────────────────────────────
  # Round-31 Tier 2.4: the default E2E job runs in dev mode. This job
  # boots the proxy with PGSTACK_ENV=production and asserts the strict
  # validator refuses placeholder secrets / dev flags / SMTP-fail-closed
  # mailer / etc. without us having to wait for someone to actually
  # deploy to a public VPS to discover the prod posture is broken.
  test-prod-validator:
    name: Production validator
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    needs: [test-proxy-go]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Round 32 F1: build the GO proxy (the one actually shipped via
      # release.yml + examples/docker-compose.prod.yml). The earlier
      # `compose build proxy` built the Rust reference impl, which made
      # this whole job a non-gate for the released artifact.
      - name: Build proxy-go image
        run: docker compose build proxy-go

      - name: Refuses on placeholder JWT_SECRET
        run: |
          set +e
          out=$(docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET=dev-only-jwt-secret-do-not-use-in-production \
            -e ANON_KEY="$(openssl rand -base64 32)" \
            -e SERVICE_ROLE_KEY="$(openssl rand -base64 32)" \
            -e SECRETS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=u -e SMTP_PASS=p \
            proxy-go 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::production validator accepted a dev-only-* JWT_SECRET"
            exit 1
          fi
          echo "✓ refused dev-only JWT_SECRET"

      - name: Refuses on missing SMTP
        run: |
          set +e
          out=$(docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e ANON_KEY="$(openssl rand -base64 32)" \
            -e SERVICE_ROLE_KEY="$(openssl rand -base64 32)" \
            -e SECRETS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            proxy-go 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::production validator accepted missing SMTP_HOST/USER/PASS"
            exit 1
          fi
          echo "✓ refused missing SMTP in production"

      # Round 32 F4 (revised round 33): the previous version backgrounded
      # `docker compose run` and racily captured its stdout, which lost
      # the "pgstack listening" line on CI. Switch to a foreground run
      # under `timeout`: validator failures exit fast with a
      # "configuration errors" line, valid env reaches the listen loop
      # and `timeout` SIGTERMs after 10s. Either way we capture full
      # output reliably.
      - name: Accepts a fully-configured production environment
        run: |
          set +e
          # Bring up the db so the validator's downstream pool probe
          # doesn't masquerade as a validator failure.
          docker compose up -d --build db
          docker compose exec -T db bash -c 'until pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'

          # The dev docker-compose.yml sets ENABLE_SQL_ENDPOINT=true
          # so the e2e suite can use the raw SQL gateway. The
          # production validator correctly refuses to boot with that
          # flag — so the positive-case run must EXPLICITLY override
          # it (and any other dev-only flag the validator rejects)
          # to false. Otherwise this step keeps catching the
          # validator's own dev-vs-prod machinery, not a regression.
          # 60s, not 15s: unlike the fail-fast refuse cases, the positive case
          # must reach the listen loop, which means connect to a just-built tmpfs
          # DB + run verifyPoolRoles + build two pools. On a cold/loaded runner
          # that can exceed 15s, killing the proxy mid-startup so neither the
          # "configuration errors" nor the "pgstack listening" line is emitted —
          # a false failure (the proxy never finished booting).
          out=$(timeout 60 docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e ANON_KEY="$(openssl rand -base64 32)" \
            -e SERVICE_ROLE_KEY="$(openssl rand -base64 32)" \
            -e SECRETS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=u -e SMTP_PASS=p \
            -e ALLOWED_ORIGINS=https://example.com \
            -e REQUIRE_AUTHENTICATED_WS=true \
            -e ENABLE_SQL_ENDPOINT=false \
            -e ENABLE_DEMO_ENDPOINT=false \
            -e ALLOW_PERMISSIVE_CORS=false \
            -e TLS_MODE=off \
            proxy-go 2>&1)
          echo "$out"

          if echo "$out" | grep -q "configuration errors"; then
            echo "::error::production validator REJECTED a valid production env"
            exit 1
          fi
          if echo "$out" | grep -q "pgstack listening"; then
            echo "✓ production validator accepted a fully-configured env (proxy started listening)"
            exit 0
          fi
          # If we got neither: the proxy died before logging "listening"
          # AND without a "configuration errors" line. That's a
          # different kind of failure — surface it.
          echo "::error::neither 'configuration errors' nor 'pgstack listening' appeared; investigate"
          exit 1

  # ─── E2E tests (full stack) ──────────────────────────────────────────────────
  test-e2e:
    name: E2E tests
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    needs: [test-extension, test-proxy-go, test-sdk]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Start full stack
        run: |
          docker compose up -d --build
          echo "Waiting for stack to be healthy..."
          # Self-hosted: health-check via compose exec (127.0.0.1 inside
          # this runner doesn't see the daemon-host's published ports).
          timeout 120 bash -c 'until docker compose exec -T proxy-go curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 2; done'
          docker network connect "${COMPOSE_PROJECT_NAME:-pg_reactive}_default" "$(hostname)" || true
          # E2E test files hardcode 127.0.0.1:8080 and 127.0.0.1:15432.
          # socat forwards those to the compose service names so the
          # tests run unchanged.
          which socat >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y socat)
          socat TCP-LISTEN:8080,fork,reuseaddr TCP:proxy-go:8080 &
          socat TCP-LISTEN:15432,fork,reuseaddr TCP:db:5432 &
          sleep 1
          echo "Stack ready"

      - name: E2E — WebSocket
        run: node tests/e2e_ws_test.mjs

      - name: E2E — Fan-out
        run: node tests/e2e_fanout_test.mjs

      - name: E2E — JWT auth
        run: node tests/e2e_jwt_test.mjs

      # Round 39 F1: an open socket must lose access when the subscription's
      # audience changes (public->private, tenant A->tenant B).
      - name: E2E — WS re-auth on audience change
        run: node tests/e2e_ws_reauth_test.mjs

      # Round 39 batch-2: the generation model. Each guards a distinct leak the
      # batch-1 per-delta re-check missed — keep them all on CI so a regression
      # in generation binding, presence/broadcast gating, snapshot rebuild, or
      # the snapshot TOCTOU fails the build instead of shipping silently.
      - name: E2E — WS generation order (F-ORDER)
        run: node tests/e2e_ws_forder_test.mjs

      - name: E2E — WS presence/broadcast re-auth (F2)
        run: node tests/e2e_ws_presence_reauth_test.mjs

      - name: E2E — WS snapshot re-subscribe rebuild (F-SNAP)
        run: node tests/e2e_ws_snapshot_reauth_test.mjs

      - name: E2E — WS snapshot TOCTOU
        run: node tests/e2e_ws_snapshot_toctou_test.mjs

      - name: E2E — Auth endpoints
        run: node tests/e2e_auth_test.mjs

      - name: E2E — REST CRUD
        run: node tests/e2e_rest_test.mjs

      - name: E2E — RLS middleware
        run: node tests/e2e_rls_test.mjs

      - name: E2E — RPC
        run: node tests/e2e_rpc_test.mjs

      - name: E2E — Resource embedding
        run: node tests/e2e_embed_test.mjs

      - name: E2E — OAuth flow
        run: node tests/e2e_oauth_test.mjs

      - name: E2E — SDK integration
        run: node tests/e2e_sdk_test.mjs

      # Password reset/change must revoke every refresh token, in one tx
      # (gemini findings: round-2 P1 + this round's #4 atomicity). Verify-off.
      - name: E2E — session revoke on password reset/change
        run: node tests/e2e_auth_session_revoke_test.mjs

      # The email-verification tests need REQUIRE_EMAIL_VERIFICATION=true (+ dummy
      # SMTP, or the proxy refuses to boot). Recreate proxy-go with that env AFTER
      # the verify-off suite above, then run the verify-on tests.
      - name: E2E — recreate proxy with email verification
        run: |
          REQUIRE_EMAIL_VERIFICATION=true SMTP_HOST=dummy SMTP_USER=u SMTP_PASS=p \
            docker compose up -d proxy-go
          timeout 60 bash -c 'until docker compose exec -T proxy-go curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 2; done'

      - name: E2E — email verification enforced
        run: node tests/e2e_auth_email_verify_test.mjs

      - name: E2E — stale verification token cannot confirm a different email (finding 2)
        run: node tests/e2e_auth_stale_verify_token_test.mjs

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > docker-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-logs
          path: docker-logs.txt

  # ─── Integration tests ───────────────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    needs: [test-extension]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Start PostgreSQL container
        run: |
          docker compose up -d --build db
          # The dev image compiles the extension in its entrypoint before
          # PostgreSQL starts; a cold compile + initdb + bootstrap can take
          # ~40s, so allow generous headroom (was 30s, which it now exceeds).
          timeout 120 bash -c 'until docker compose exec -T db pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'

      - name: Shared memory pressure test
        run: |
          docker compose exec -T db bash -c \
            'cd /ext && python3 tests/integration/test_shmem_pressure.py'

      - name: NOTIFY throughput test
        run: |
          docker compose exec -T db bash -c \
            'cd /ext && python3 tests/integration/test_notify_throughput.py'

  # ─── Async-recompute background worker (FR-R.12) ─────────────────────────────
  # The worker is PGC_POSTMASTER + off by default, so it can't run in the normal
  # stack or pg_regress (CLAUDE.md). Boot a one-off PostgreSQL with it enabled and
  # assert the worker connects + delivers an async delta. gemini audit R9-3.
  test-async-bgworker:
    name: Async recompute bgworker
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    needs: [test-extension]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Boot PostgreSQL with the async-recompute worker enabled
        run: |
          docker compose run -d --build --name pgr_async_${{ github.run_id }}_${{ github.run_attempt }} --no-deps db \
            postgres -c shared_preload_libraries=pg_reactive -c log_min_messages=warning \
            -c pg_reactive.async_recompute=on -c pg_reactive.database=pg_reactive_test
          timeout 150 bash -c 'until docker exec pgr_async_${{ github.run_id }}_${{ github.run_attempt }} pg_isready -h 127.0.0.1 -U postgres -d pg_reactive_test; do sleep 3; done'

      - name: Run async-recompute integration test
        run: |
          docker exec pgr_async_${{ github.run_id }}_${{ github.run_attempt }} psql -U postgres -d pg_reactive_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pg_reactive"
          docker exec pgr_async_${{ github.run_id }}_${{ github.run_attempt }} python3 /ext/tests/integration/test_async_recompute.py

      - name: Teardown
        if: always()
        run: docker rm -f pgr_async_${{ github.run_id }}_${{ github.run_attempt }} || true

  # ─── Security audit ──────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # --omit=dev limits the audit to runtime dependencies. Dev-only chains
      # (vite, vitest, stryker, postcss, ...) ship vulns of their own that
      # don't reach end users of the SDK/CLI — auditing them blocks CI on
      # toolchain churn rather than real consumer risk.
      - name: npm audit — SDK
        working-directory: sdk
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit — CLI
        working-directory: cli
        run: npm audit --audit-level=high --omit=dev

      # Round 37 F4: the docs site was previously unaudited. Its dependency tree
      # pulls webpack-dev-server (a build/dev-server-only chain that never lands
      # in the static output or the proxy-go runtime image), so the residual
      # MODERATE advisories there are toolchain risk, not consumer risk — hence
      # --audit-level=high, matching SDK/CLI. The one CRITICAL (shell-quote
      # GHSA-w7jw-789q-3m8p) is pinned to the patched ^1.8.4 via an override in
      # docs/site/package.json, so this gate stays meaningful instead of being
      # permanently red on an unshipped dev-server transitive.
      #
      # 2026-08-30: image-size (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq —
      # ICNS/JXL/HEIF infinite-loop DoS) has NO patched release; it is the
      # build-time image prober in @docusaurus/mdx-loader and never ships in
      # the static output. The gate script allowlists those two ids and FAILS
      # the moment upstream publishes a fix, so the exception self-expires.
      - name: npm audit — Docs site
        run: node scripts/npm-audit-gate.mjs docs/site GHSA-w3rx-r6r6-pgpr GHSA-5p2g-fcmc-qvqq

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: "1.88"

      - name: cargo audit
        working-directory: proxy
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

  # ─── Publish release-candidate images (build ONCE, promote at release) ───────
  # Supply-chain provenance (gemini finding 7): release.yml must NOT rebuild the
  # Docker images from a mutable base (Dockerfile.dev's `FROM postgres:16-bookworm`)
  # — a release-time rebuild ships bytes CI never saw, and a base republish between
  # CI and release silently changes them. Instead CI builds each image ONCE here,
  # on a GREEN master push, and pushes it under the immutable per-commit staging
  # tag `sha-<sha>`. release.yml then PROMOTES that exact digest to the version
  # tags with `docker buildx imagetools create` — a manifest copy, no rebuild, no
  # second base pull. Only trusted master pushes publish (PRs have no
  # packages:write and run on ephemeral runners); `needs` the full suite so a
  # staged image always corresponds to a green CI run for its sha.
  build-publish-images:
    name: Publish release-candidate images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Multi-arch (amd64 + arm64-via-QEMU) builds are slow under emulation —
    # proxy-rust's arm64 cargo build alone can take ~60 min. A timeout does NOT
    # honour continue-on-error: a timed-out job is CANCELLED, and a cancelled job
    # cancels the whole CI run, which makes deploy.yml's "CI is green" gate skip
    # (the exact coupling the continue-on-error below is meant to prevent). So the
    # budget must comfortably exceed the slowest healthy run, not just barely fit.
    timeout-minutes: 240
    # Image publishing is DISTRIBUTION, not a quality gate. A flaky push to GHCR
    # (runner network) must not redden CI and thereby block deploys of an
    # otherwise-green commit (deploy.yml gates on CI conclusion). Release safety is
    # unaffected: release.yml promotes only the sha-<commit> tag, which is created
    # solely after the smoke passes — no publish ⇒ no tag ⇒ release fails honestly.
    continue-on-error: true
    needs:
      - test-extension
      - test-proxy-go
      - test-proxy
      - test-sdk
      - test-cli
      - test-security
      - test-prod-validator
      - test-e2e
      - test-integration
      - test-async-bgworker
      - security
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Reuse one named builder across runs and DON'T tear it down at the end.
          # The Dockerfile's `--mount=type=cache` (cargo registry + per-arch target)
          # lives inside the builder's BuildKit instance; a fresh builder per run
          # left it empty every time, so the Rust build recompiled all ~300 deps
          # (~1h40m). On this persistent self-hosted runner a kept builder makes the
          # cache survive → an unchanged-deps build recompiles only the proxy crate
          # (~2m, measured locally cold ~1h40m vs warm 105s).
          name: pgstack-buildx
          cleanup: false
          # Route docker.io metadata/pulls through the VPS pull-through cache
          # (installed by runner-maintenance.yml; docker0 gateway = 172.17.0.1,
          # reachable from the buildkitd container). BuildKit falls back to the
          # upstream registry when the mirror is down, so this is safe even
          # before the mirror exists. Applies only when the builder is
          # (re)created — an existing pgstack-buildx keeps its old config AND
          # its warm cargo cache; do not rm it just to pick this up.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["172.17.0.1:5000"]
            [registry."172.17.0.1:5000"]
              http = true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push to a UNIQUE per-run staging tag (never sha-<sha>) and capture the
      # digest. The sha-<sha> tag — the one release resolves — is created only
      # AFTER the smoke passes (last step), so a re-run whose smoke fails can never
      # leave sha-<sha> pointing at an un-smoked image (gemini finding 1).
      - name: Build and push pgstack-proxy (staging)
        id: proxy
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./proxy-go/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pgstack-proxy:_staging-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push pgstack-proxy-rust (staging)
        id: proxy_rust
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pgstack-proxy-rust:_staging-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push pgstack-postgres (staging)
        id: postgres
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pgstack-postgres:_staging-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The all-in-one (PG + extension + proxy in one container) — a published
      # DEMO/SINGLE-TENANT quickstart, NOT the hardened split posture (see
      # docker/Dockerfile.all-in-one). Built + smoked + promoted like the rest.
      - name: Build and push pgstack-all-in-one (staging)
        id: all_in_one
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./docker/Dockerfile.all-in-one
          # amd64-only: the all-in-one's arm64 build (extension + Go proxy + apt,
          # ALL under QEMU emulation) intermittently HANGS, running the candidate
          # job to its 120-min timeout → the job is cancelled → the whole CI run
          # is cancelled (continue-on-error covers failure, NOT cancellation) →
          # the deploy's "CI is green" gate skips. The all-in-one is a demo /
          # single-tenant quickstart, so amd64-only is an acceptable trade; the
          # split production images stay multi-arch (they build reliably).
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pgstack-all-in-one:_staging-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke the EXACT digest just built on BOTH published arches (via the QEMU
      # set up above) — logic in the scripts; the release promotes only a digest
      # these passed (gemini findings 1/2/R24-1, extracted per R27).
      - name: Smoke-test pgstack-postgres candidate (boot + extension load, amd64 + arm64)
        run: bash .github/scripts/smoke-postgres.sh "${IMAGE_PREFIX}/pgstack-postgres@${{ steps.postgres.outputs.digest }}"

      - name: Tear down candidate db
        if: always()
        run: docker rm -f cand-db >/dev/null 2>&1 || true

      - name: Smoke-test pgstack-proxy candidate (production validator, amd64 + arm64)
        run: bash .github/scripts/smoke-proxy.sh "${IMAGE_PREFIX}/pgstack-proxy@${{ steps.proxy.outputs.digest }}"

      - name: Smoke-test pgstack-proxy-rust candidate (production validator, amd64 + arm64)
        run: bash .github/scripts/smoke-proxy-rust.sh "${IMAGE_PREFIX}/pgstack-proxy-rust@${{ steps.proxy_rust.outputs.digest }}"

      - name: Smoke-test pgstack-all-in-one candidate (boot PG + extension + proxy, amd64 + arm64)
        run: bash .github/scripts/smoke-all-in-one.sh "${IMAGE_PREFIX}/pgstack-all-in-one@${{ steps.all_in_one.outputs.digest }}"

      # Only now — all smokes green — create the sha-<sha> tag release resolves,
      # pointing at the exact smoke-passed digests (gemini finding 1).
      - name: Tag the smoke-passed digests as sha-<sha>
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE_PREFIX}/pgstack-proxy:sha-${{ github.sha }}"      "${IMAGE_PREFIX}/pgstack-proxy@${{ steps.proxy.outputs.digest }}"
          docker buildx imagetools create -t "${IMAGE_PREFIX}/pgstack-proxy-rust:sha-${{ github.sha }}" "${IMAGE_PREFIX}/pgstack-proxy-rust@${{ steps.proxy_rust.outputs.digest }}"
          docker buildx imagetools create -t "${IMAGE_PREFIX}/pgstack-postgres:sha-${{ github.sha }}"   "${IMAGE_PREFIX}/pgstack-postgres@${{ steps.postgres.outputs.digest }}"
          docker buildx imagetools create -t "${IMAGE_PREFIX}/pgstack-all-in-one:sha-${{ github.sha }}" "${IMAGE_PREFIX}/pgstack-all-in-one@${{ steps.all_in_one.outputs.digest }}"
          echo "✓ tagged proxy/proxy-rust/postgres/all-in-one digests as sha-${{ github.sha }}"
