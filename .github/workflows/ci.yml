name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─── Extension tests (pg_regress + isolation) ───────────────────────────────
  test-extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL container
        run: |
          docker compose up -d db
          docker compose exec -T db bash -c 'until pg_isready -U postgres; do sleep 1; done'

      - name: Build extension
        run: |
          docker compose exec -T db bash -c \
            'cd /ext/ext && make clean && make && make install'

      - name: pg_regress tests
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "cd /ext/ext && make installcheck"'

      - name: Isolation tests
        run: |
          docker compose exec -T db bash -c \
            'su - postgres -c "cd /ext/ext && make isolation_installcheck"'

      - name: Upload regression diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs
          path: |
            ext/regression.diffs
            ext/regression.out

  # ─── Rust proxy ─────────────────────────────────────────────────────────────
  # Released artifact gate. The published proxy in
  # examples/docker-compose.prod.yml and release.yml is `proxy-go`;
  # security CI MUST block on this job, not on test-proxy (Rust).
  # Audit round 32 F1.
  test-proxy-go:
    name: Proxy (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: proxy-go/go.sum

      - name: Build
        working-directory: proxy-go
        run: go build ./...

      - name: Vet
        working-directory: proxy-go
        run: go vet ./...

      - name: Unit tests
        working-directory: proxy-go
        run: go test -count=1 ./...

  # Reference implementation. Kept building so the Rust proxy doesn't
  # bit-rot, but it is NOT a release gate — security/prod-validator
  # depend on test-proxy-go above.
  test-proxy:
    name: Proxy (Rust, reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            proxy/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('proxy/Cargo.lock') }}

      - name: Clippy
        working-directory: proxy
        run: cargo clippy -- -D warnings

      - name: Format check
        working-directory: proxy
        run: cargo fmt --check

      - name: Build
        working-directory: proxy
        run: cargo build --release

      - name: Unit tests
        working-directory: proxy
        run: cargo test

  # ─── TypeScript SDK ──────────────────────────────────────────────────────────
  test-sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Start PostgreSQL for integration tests
        run: |
          docker compose up -d db
          docker compose exec -T db bash -c 'until pg_isready -U postgres; do sleep 1; done'

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Type check
        working-directory: sdk
        run: npx tsc --noEmit

      - name: Tests
        working-directory: sdk
        run: npm test

      - name: Build
        working-directory: sdk
        run: npm run build

  # ─── CLI ────────────────────────────────────────────────────────────────────
  test-cli:
    name: CLI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Type check
        working-directory: cli
        run: npx tsc --noEmit

      - name: Tests
        working-directory: cli
        run: npm test

      - name: Build
        working-directory: cli
        run: npm run build

      # Audit round 26 F2: published cli/dist must match a fresh build of
      # cli/src. Otherwise a hardened source change (e.g. removing blanket
      # GRANTs from the generated bootstrap migration) can sit in the
      # repo while the published bin runs stale insecure JS.
      - name: cli/dist parity (rebuild must produce no diff)
        working-directory: cli
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::cli/dist is out of date — run 'npm run build' inside cli/ and commit the result."
            exit 1
          fi

      # Round-31 Tier 2.3: cli/templates/bootstrap-core.sql is generated
      # from docker/init.sql (BEGIN/END-PGSTACK-CORE region). Drift =
      # round-12 / round-28 footguns silently regress in the CLI bootstrap.
      - name: cli/templates/bootstrap-core.sql parity (re-sync must produce no diff)
        run: |
          node scripts/sync-cli-bootstrap.mjs
          if ! git diff --exit-code cli/templates/bootstrap-core.sql; then
            echo "::error::cli/templates/bootstrap-core.sql is out of date — run 'node scripts/sync-cli-bootstrap.mjs' and commit the result."
            exit 1
          fi

  # ─── Adversarial security fixtures ──────────────────────────────────────────
  # Round-31 Tier 3.5: negative tests in tests/security/ assert that
  # specific attacks are refused. Each prior audit finding leaves one
  # such test behind, per the SECURITY.md ritual.
  test-security:
    name: Adversarial security
    runs-on: ubuntu-latest
    needs: [test-proxy-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Round 32 F2: REQUIRE_AUTHENTICATED_WS=true is what makes the
      # ws__anon_refused_when_required test actually exercise the
      # anon-key bypass gate. Without it the test would only cover
      # the "no token at all" path, which is the trivial reject.
      - name: Bring up stack (REQUIRE_AUTHENTICATED_WS=true)
        run: |
          REQUIRE_AUTHENTICATED_WS=true docker compose up -d --build
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080/health; do sleep 2; done'

      - name: Install ws (needed by anon-WS test)
        run: cd tests && npm install ws

      - name: Static lint for unsafe SQL / Markdown patterns
        run: node tests/lint/security_patterns.mjs

      - name: Run adversarial fixtures
        env:
          PROXY_URL: http://127.0.0.1:8080
          # Match the dev-compose default so ws__anon_refused_when_required
          # actually authenticates as anon (round 32 F2).
          ANON_KEY: dev-only-anon-key-do-not-use-in-production
          SERVICE_ROLE_KEY: dev-only-service-role-key-do-not-use-in-production
          # Surface to the test so it asserts the right outcome — the
          # proxy was started with this flag above; the test reads it
          # from its own env to decide expected pass condition.
          REQUIRE_AUTHENTICATED_WS: "true"
        run: |
          set -e
          for t in tests/security/*.test.mjs; do
            echo ""
            echo "=== $t ==="
            node "$t"
          done

      - name: Run doc-SQL smoke
        run: node tests/doc_sql_smoke_test.mjs

  # ─── Production-mode validator E2E ──────────────────────────────────────────
  # Round-31 Tier 2.4: the default E2E job runs in dev mode. This job
  # boots the proxy with PGSTACK_ENV=production and asserts the strict
  # validator refuses placeholder secrets / dev flags / SMTP-fail-closed
  # mailer / etc. without us having to wait for someone to actually
  # deploy to a public VPS to discover the prod posture is broken.
  test-prod-validator:
    name: Production validator
    runs-on: ubuntu-latest
    needs: [test-proxy-go]
    steps:
      - uses: actions/checkout@v4

      # Round 32 F1: build the GO proxy (the one actually shipped via
      # release.yml + examples/docker-compose.prod.yml). The earlier
      # `compose build proxy` built the Rust reference impl, which made
      # this whole job a non-gate for the released artifact.
      - name: Build proxy-go image
        run: docker compose build proxy-go

      - name: Refuses on placeholder JWT_SECRET
        run: |
          set +e
          out=$(docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET=dev-only-jwt-secret-do-not-use-in-production \
            -e ANON_KEY=$(openssl rand -base64 32) \
            -e SERVICE_ROLE_KEY=$(openssl rand -base64 32) \
            -e SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=u -e SMTP_PASS=p \
            proxy-go 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::production validator accepted a dev-only-* JWT_SECRET"
            exit 1
          fi
          echo "✓ refused dev-only JWT_SECRET"

      - name: Refuses on missing SMTP
        run: |
          set +e
          out=$(docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET=$(openssl rand -base64 32) \
            -e ANON_KEY=$(openssl rand -base64 32) \
            -e SERVICE_ROLE_KEY=$(openssl rand -base64 32) \
            -e SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            proxy-go 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::production validator accepted missing SMTP_HOST/USER/PASS"
            exit 1
          fi
          echo "✓ refused missing SMTP in production"

      # Round 32 F4: the previous version of this step ended in
      # `|| true`, so the validator silently regressing on a valid
      # production env would not have failed CI. Now we capture the
      # exit code and accept only the "validator OK, then DB
      # unreachable (because we didn't start one)" outcome — any
      # `configuration errors` line from the validator means the
      # gate failed and the step exits non-zero.
      - name: Accepts a fully-configured production environment
        run: |
          set +e
          # Bring up just the DB so the validator's downstream pool
          # probe doesn't masquerade as a validator failure.
          docker compose up -d db
          docker compose exec -T db bash -c 'until pg_isready -U postgres; do sleep 1; done'

          out=$(docker compose run --rm \
            -e PGSTACK_ENV=production \
            -e JWT_SECRET=$(openssl rand -base64 32) \
            -e ANON_KEY=$(openssl rand -base64 32) \
            -e SERVICE_ROLE_KEY=$(openssl rand -base64 32) \
            -e SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e SMTP_HOST=smtp.example.com -e SMTP_USER=u -e SMTP_PASS=p \
            -e ALLOWED_ORIGINS=https://example.com \
            -e REQUIRE_AUTHENTICATED_WS=true \
            -e TLS_MODE=off \
            proxy-go 2>&1 &)
          # Give the proxy a couple of seconds to either die in the
          # validator (bad) or settle past it (good).
          sleep 5
          docker compose stop proxy-go >/dev/null 2>&1
          echo "$out"
          if echo "$out" | grep -q "configuration errors"; then
            echo "::error::production validator REJECTED a valid production env"
            exit 1
          fi
          if echo "$out" | grep -q "pgstack listening"; then
            echo "✓ production validator accepted a fully-configured env (proxy started listening)"
            exit 0
          fi
          # If we got neither: the proxy died before logging "listening"
          # AND without a "configuration errors" line. That's a
          # different kind of failure — surface it.
          echo "::error::neither 'configuration errors' nor 'pgstack listening' appeared; investigate"
          exit 1

  # ─── E2E tests (full stack) ──────────────────────────────────────────────────
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [test-extension, test-proxy, test-sdk]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start full stack
        run: |
          docker compose up -d --build
          echo "Waiting for stack to be healthy..."
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080/health; do sleep 2; done'
          echo "Stack ready"

      - name: E2E — WebSocket
        run: node tests/e2e_ws_test.mjs

      - name: E2E — Fan-out
        run: node tests/e2e_fanout_test.mjs

      - name: E2E — JWT auth
        run: node tests/e2e_jwt_test.mjs

      - name: E2E — Auth endpoints
        run: node tests/e2e_auth_test.mjs

      - name: E2E — REST CRUD
        run: node tests/e2e_rest_test.mjs

      - name: E2E — RLS middleware
        run: node tests/e2e_rls_test.mjs

      - name: E2E — RPC
        run: node tests/e2e_rpc_test.mjs

      - name: E2E — Resource embedding
        run: node tests/e2e_embed_test.mjs

      - name: E2E — OAuth flow
        run: node tests/e2e_oauth_test.mjs

      - name: E2E — SDK integration
        run: node tests/e2e_sdk_test.mjs

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > docker-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

  # ─── Integration tests ───────────────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [test-extension]
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL container
        run: |
          docker compose up -d db
          timeout 30 bash -c 'until docker compose exec -T db pg_isready -U postgres; do sleep 1; done'

      - name: Shared memory pressure test
        run: |
          docker compose exec -T db bash -c \
            'cd /ext && python3 tests/integration/test_shmem_pressure.py'

      - name: NOTIFY throughput test
        run: |
          docker compose exec -T db bash -c \
            'cd /ext && python3 tests/integration/test_notify_throughput.py'

  # ─── Security audit ──────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --omit=dev limits the audit to runtime dependencies. Dev-only chains
      # (vite, vitest, stryker, postcss, ...) ship vulns of their own that
      # don't reach end users of the SDK/CLI — auditing them blocks CI on
      # toolchain churn rather than real consumer risk.
      - name: npm audit — SDK
        working-directory: sdk
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit — CLI
        working-directory: cli
        run: npm audit --audit-level=high --omit=dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: cargo audit
        working-directory: proxy
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit
