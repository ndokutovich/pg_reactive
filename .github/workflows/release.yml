name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Require green CI for the tagged commit ──────────────────────────────────
  # Release triggers on a v* tag, and CI does not run on tags — so without this
  # gate a tag on an unverified (or red) commit would still publish Docker/npm
  # artifacts and a GitHub release (gemini audit R4-4). Every publish job needs
  # this one, so a missing/failed CI run for the tagged SHA aborts the release.
  ci-gate:
    name: Require green CI for the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # The critical gate logic lives in execution-tested scripts (tests/
      # release_scripts_test.mjs), not inline shell — regex-analysis of inline
      # workflow shell had hit its limit (gemini R27). checkout first so the
      # scripts are present on the runner.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Require a SUCCESSFUL CI run for this exact SHA on a master push — not a
      # fork/PR run that shares the SHA. (release triggers on a tag; CI does not.)
      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/require-green-ci.sh "${{ github.repository }}" "${{ github.sha }}"

      # The git tag is the single source of truth for the version: strict SemVer +
      # sdk/cli package.json must match it, or npm would ship a stale version.
      - name: Validate the tag is strict SemVer and matches SDK/CLI versions
        run: bash .github/scripts/validate-release-version.sh "${{ github.ref_name }}"

  # ─── Build and push Docker images ────────────────────────────────────────────
  docker-proxy:
    name: Docker — pgstack-proxy
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Docker Hub mirroring is opt-in: only when both DOCKERHUB_* secrets are set,
    # so a repo without them still publishes GHCR + npm.
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Promote the EXACT digest CI built + smoked for this commit (gemini finding
      # 7) — resolve the immutable sha-<sha> staging tag and imagetools-create the
      # version tags from it (no rebuild). Logic + tag-set in promote-image.sh /
      # compute-docker-tags.sh (the latter execution-tested).
      - name: Promote the CI-built digest to release tags
        run: bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-proxy" "${{ github.sha }}" "${{ github.ref_name }}"

      # Mirror the SAME smoked GHCR digest to Docker Hub (manifest copy, no rebuild
      # — identical bytes). Skipped when DOCKERHUB_* are unset.
      - name: Mirror the smoked digest to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        run: TARGET_REPO="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pgstack-proxy" bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-proxy" "${{ github.sha }}" "${{ github.ref_name }}"

  docker-proxy-rust:
    name: Docker — pgstack-proxy-rust
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Promote the EXACT digest CI built + smoked (gemini finding 7) — the Rust
      # sibling proxy ships to the same bar as the Go proxy. No rebuild.
      - name: Promote the CI-built digest to release tags
        run: bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-proxy-rust" "${{ github.sha }}" "${{ github.ref_name }}"

      - name: Mirror the smoked digest to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        run: TARGET_REPO="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pgstack-proxy-rust" bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-proxy-rust" "${{ github.sha }}" "${{ github.ref_name }}"

  docker-postgres:
    name: Docker — pgstack-postgres
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Promote the EXACT digest CI built + smoked (gemini finding 7) — see
      # docker-proxy. The 4th arg `16` is the fixed PostgreSQL-major tag, applied
      # by promote-image.sh only for final releases.
      - name: Promote the CI-built digest to release tags
        run: bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-postgres" "${{ github.sha }}" "${{ github.ref_name }}" 16

      - name: Mirror the smoked digest to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        run: TARGET_REPO="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pgstack-postgres" bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-postgres" "${{ github.sha }}" "${{ github.ref_name }}" 16

  docker-all-in-one:
    name: Docker — pgstack-all-in-one
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The all-in-one demo/single-tenant quickstart — promote the smoked digest.
      - name: Promote the CI-built digest to release tags
        run: bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-all-in-one" "${{ github.sha }}" "${{ github.ref_name }}"

      - name: Mirror the smoked digest to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        run: TARGET_REPO="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pgstack-all-in-one" bash .github/scripts/promote-image.sh "${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-all-in-one" "${{ github.sha }}" "${{ github.ref_name }}"

  # ─── Publish npm packages ────────────────────────────────────────────────────
  npm-sdk:
    name: npm — @pgstack/sdk
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # No id-token: --provenance is disabled (private repo — see Publish step).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        working-directory: sdk
        run: npm ci && npm run build

      - name: Publish
        working-directory: sdk
        run: |
          # dist-tag from the execution-tested npm-dist-tag.sh (pre-release -> next,
          # never latest). $GITHUB_WORKSPACE is the repo root (working-directory is the package).
          NPM_TAG="$(bash "$GITHUB_WORKSPACE/.github/scripts/npm-dist-tag.sh" "$GITHUB_REF_NAME")"
          # No --provenance: npm/sigstore provenance requires a PUBLIC source repo,
          # but this repo is private (422 "Unsupported GitHub Actions source
          # repository visibility: private"). Publish without attestation —
          # consumers can't rely on `npm audit signatures` for these packages
          # (documented in SECURITY.md inv 23). Restore --provenance if the repo
          # ever goes public.
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-cli:
    name: npm — pgstack CLI
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # No id-token: --provenance is disabled (private repo — see Publish step).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        working-directory: cli
        run: npm ci && npm run build

      - name: Publish
        working-directory: cli
        run: |
          # dist-tag from the execution-tested npm-dist-tag.sh (pre-release -> next,
          # never latest). $GITHUB_WORKSPACE is the repo root (working-directory is the package).
          NPM_TAG="$(bash "$GITHUB_WORKSPACE/.github/scripts/npm-dist-tag.sh" "$GITHUB_REF_NAME")"
          # No --provenance: npm/sigstore provenance requires a PUBLIC source repo,
          # but this repo is private (422 "Unsupported GitHub Actions source
          # repository visibility: private"). Publish without attestation —
          # consumers can't rely on `npm audit signatures` for these packages
          # (documented in SECURITY.md inv 23). Restore --provenance if the repo
          # ever goes public.
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── GitHub Release ──────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-proxy, docker-proxy-rust, docker-postgres, docker-all-in-one, npm-sdk, npm-cli]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            ## pgStack ${{ github.ref_name }}

            ### Docker images
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/pgstack-proxy:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/pgstack-postgres:${{ steps.version.outputs.version }}
            ```

            ### npm packages
            ```bash
            npm install @pgstack/sdk@${{ steps.version.outputs.version }}
            npm install -g pgstack@${{ steps.version.outputs.version }}
            ```
