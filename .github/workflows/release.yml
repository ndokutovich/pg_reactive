name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Require green CI for the tagged commit ──────────────────────────────────
  # Release triggers on a v* tag, and CI does not run on tags — so without this
  # gate a tag on an unverified (or red) commit would still publish Docker/npm
  # artifacts and a GitHub release (gemini audit R4-4). Every publish job needs
  # this one, so a missing/failed CI run for the tagged SHA aborts the release.
  ci-gate:
    name: Require green CI for the tagged commit
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify a successful CI run exists for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No successful CI run for ${{ github.sha }} (tag ${{ github.ref_name }}). Only tag a commit that is green on master." >&2
            exit 1
          fi
          echo "CI is green for ${{ github.sha }} (${n} successful run(s)) — proceeding."

  # ─── Build and push Docker images ────────────────────────────────────────────
  docker-proxy:
    name: Docker — pgstack-proxy
    needs: ci-gate
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push proxy image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./proxy-go/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-postgres:
    name: Docker — pgstack-postgres
    needs: ci-gate
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pgstack-postgres
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=16
            type=raw,value=latest

      - name: Build and push postgres image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Publish npm packages ────────────────────────────────────────────────────
  npm-sdk:
    name: npm — @pgstack/sdk
    needs: ci-gate
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        working-directory: sdk
        run: npm ci && npm run build

      - name: Publish
        working-directory: sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-cli:
    name: npm — pgstack CLI
    needs: ci-gate
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        working-directory: cli
        run: npm ci && npm run build

      - name: Publish
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── GitHub Release ──────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: [self-hosted, Linux, X64]
    needs: [docker-proxy, docker-postgres, npm-sdk, npm-cli]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            ## pgStack ${{ github.ref_name }}

            ### Docker images
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/pgstack-proxy:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/pgstack-postgres:${{ steps.version.outputs.version }}
            ```

            ### npm packages
            ```bash
            npm install @pgstack/sdk@${{ steps.version.outputs.version }}
            npm install -g pgstack@${{ steps.version.outputs.version }}
            ```
