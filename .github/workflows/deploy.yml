name: Deploy to VPS

on:
  push:
    branches: [master]
    paths:
      - 'examples/**'
      - 'proxy-go/**'
      - 'public/**'
      - 'ext/**'
      - 'docker/**'
      - 'docs/site/**'
      - 'studio/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/opt/apps/pg-reactive-src
            TOKENLESS_URL="https://github.com/${{ github.repository }}.git"
            # The fetch URL carries the token inline but is passed on the
            # command line — git never writes it into .git/config because
            # we never `set-url origin` to it. The persisted remote stays
            # tokenless, so a VPS attacker reading the checkout cannot
            # exfiltrate a fresh GitHub credential. (Audit F6, 2026-05.)
            AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # First-run bootstrap: clone fresh if the directory is missing.
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p /opt/apps
              sudo chown "$USER":"$USER" /opt/apps
              git clone "$AUTH_URL" "$APP_DIR"
              git -C "$APP_DIR" remote set-url origin "$TOKENLESS_URL"
            fi

            cd "$APP_DIR"
            # Force the persisted remote URL to be tokenless even if a
            # previous deploy embedded credentials in it.
            git remote set-url origin "$TOKENLESS_URL"
            # Fetch via the authenticated URL (one-shot, not persisted)
            # and reset the local branch to the fetched ref.
            git fetch "$AUTH_URL" master
            git reset --hard FETCH_HEAD

            # Idempotent secret bootstrap: first run generates .env with
            # cryptographically random values for every required secret;
            # subsequent runs leave existing values alone so live keys
            # are never rotated out from under the running services.
            bash scripts/bootstrap-env.sh

            docker network create gateway 2>/dev/null || true
            # --env-file pins the .env path to the repo root regardless of
            # which compose file is `-f` first. Without it, compose v2
            # would look for .env next to examples/docker-compose.yml.
            docker compose --env-file .env \
              -f examples/docker-compose.yml \
              -f examples/docker-compose.prod.yml \
              build --parallel
            docker compose --env-file .env \
              -f examples/docker-compose.yml \
              -f examples/docker-compose.prod.yml \
              up -d

            # Install every tracked umbrella nginx conf — one file per
            # subdomain — into /opt/proxy/nginx/conf.d/, then `nginx -t`
            # the lot and reload on success. Tracked here so the contract
            # cannot rot away from a separate ops repo's checkout. The
            # original gap this closes is round 34: umbrella had no
            # server_name match for reactive.pgstack.org, every request
            # fell to the default server and served a stale baked-in
            # landing. Each app subdomain (polyglot.pgstack.org etc) gets
            # its own conf in deploy/umbrella/.
            CHANGED=0
            for SRC in deploy/umbrella/*.conf; do
              [ -f "$SRC" ] || continue
              DST=/opt/proxy/nginx/conf.d/$(basename "$SRC")
              if ! sudo cmp -s "$SRC" "$DST" 2>/dev/null; then
                sudo cp "$SRC" "$DST"
                CHANGED=1
              fi
            done
            if [ "$CHANGED" = "1" ]; then
              sudo docker exec umbrella-proxy nginx -t \
                && sudo docker exec umbrella-proxy nginx -s reload \
                || { echo "::error::umbrella nginx -t failed after copy"; exit 1; }
            fi

            docker image prune -f
