name: Deploy to VPS

on:
  push:
    branches: [master]
    paths:
      - 'examples/**'
      - 'proxy-go/**'
      - 'public/**'
      - 'ext/**'
      - 'docker/**'
      - 'docs/site/**'
      - 'studio/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            APP_DIR=/opt/apps/pg-reactive-src

            # First-run bootstrap: clone fresh if the directory is missing.
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p /opt/apps
              sudo chown "$USER":"$USER" /opt/apps
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin master
            git reset --hard origin/master

            docker network create gateway 2>/dev/null || true
            docker compose \
              -f examples/docker-compose.yml \
              -f examples/docker-compose.prod.yml \
              build --parallel
            docker compose \
              -f examples/docker-compose.yml \
              -f examples/docker-compose.prod.yml \
              up -d
            docker image prune -f
