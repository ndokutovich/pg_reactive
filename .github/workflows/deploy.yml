name: Deploy to VPS

on:
  # Deploy only a CI-VERIFIED commit. Fire when the CI workflow finishes, then
  # gate (job `if` below) on success + a trusted master push, and deploy that
  # exact SHA. workflow_dispatch is the always-available manual fallback.
  # (gemini audit finding 7 — was: push, running in parallel with CI and
  # git-resetting to a moving master, so unverified/newer code could ship.)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      actions: read
    # Only when CI passed on a trusted master push (NOT a PR-triggered CI run),
    # or a manual dispatch ON master. workflow_dispatch must be pinned to
    # refs/heads/master — otherwise a maintainer could dispatch this workflow
    # against a feature branch and deploy unverified code straight past branch
    # protection + CI (the DEPLOY_SHA for a dispatch is github.sha, i.e. the
    # selected ref's tip). gemini audit finding 3.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    steps:
      # The workflow_run path is CI-gated by the job `if` (it fires only on a
      # successful CI completion). A manual dispatch has no such proof, so it must
      # verify a green CI run exists for this exact SHA on master — otherwise a red
      # master commit could be hand-deployed (gemini finding 1, R23).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
      - name: Require green CI for the dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/require-green-ci.sh "${{ github.repository }}" "${{ github.sha }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # The exact commit CI validated (workflow_run), or current master for a
          # manual dispatch. Deployed verbatim — never a moving branch ref.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_SHA
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/opt/apps/pg-reactive-src
            TOKENLESS_URL="https://github.com/${{ github.repository }}.git"
            # The fetch URL carries the token inline but is passed on the
            # command line — git never writes it into .git/config because
            # we never `set-url origin` to it. The persisted remote stays
            # tokenless, so a VPS attacker reading the checkout cannot
            # exfiltrate a fresh GitHub credential. (Audit F6, 2026-05.)
            AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # First-run bootstrap: clone fresh if the directory is missing.
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p /opt/apps
              sudo chown "$USER":"$USER" /opt/apps
              git clone "$AUTH_URL" "$APP_DIR"
              git -C "$APP_DIR" remote set-url origin "$TOKENLESS_URL"
            fi

            cd "$APP_DIR"
            # Force the persisted remote URL to be tokenless even if a
            # previous deploy embedded credentials in it.
            git remote set-url origin "$TOKENLESS_URL"
            # Fetch the EXACT CI-verified commit (one-shot authenticated URL,
            # not persisted) and reset to it — never a moving branch ref.
            git fetch "$AUTH_URL" "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            echo "deploying $DEPLOY_SHA"

            # Idempotent secret bootstrap: first run generates .env with
            # cryptographically random values for every required secret;
            # subsequent runs leave existing values alone so live keys
            # are never rotated out from under the running services.
            bash scripts/bootstrap-env.sh

            docker network create gateway 2>/dev/null || true
            # --env-file pins the .env path to the repo root regardless of
            # which compose file is `-f` first. Without it, compose v2
            # would look for .env next to examples/docker-compose.yml.
            docker compose --env-file .env \
              -f examples/docker-compose.yml \
              -f examples/docker-compose.prod.yml \
              build --parallel
            # Recreate the DB volume each deploy. The proxy now connects as the
            # NON-superuser `authenticator` role, which docker/init.sql creates
            # (and docker/20-authenticator-login.sh gives a password) only at
            # FIRST init — an existing pre-authenticator volume would leave the
            # proxy unable to connect (gemini audit findings 1 & 5). The examples
            # are seeded demos: the `setup` service re-seeds on boot, so PG data
            # is ephemeral here, exactly like the polyglot deploy.
            docker compose --env-file .env \
              -f examples/docker-compose.yml \
              -f examples/docker-compose.prod.yml \
              down -v --remove-orphans || true
            # Belt-and-suspenders: `down --remove-orphans` can leave a container
            # wedged in "removing" (it kept holding examples_pgdata above), so the
            # next `up` hits "container name already in use" against that orphan.
            # Force-remove any lingering examples-* container by name first.
            docker ps -aq --filter 'name=^examples-' | xargs -r docker rm -f || true
            docker compose --env-file .env \
              -f examples/docker-compose.yml \
              -f examples/docker-compose.prod.yml \
              up -d

            # Umbrella nginx routes are owned by the umbrella repo
            # (vps-12gb-pgstack) — single source of truth. Adding a new
            # subdomain = PR to that repo's nginx/conf.d/, not here.
            # The previous in-place copy from deploy/umbrella/ silently
            # masked the umbrella's own app-reactive.conf because both
            # had server_name reactive.pgstack.org and nginx took the
            # first by alphabetical filename — see umbrella commit
            # 178ca7f for the takeover.

            docker image prune -f

  # ── Polyglot matching-engines showcase ──
  # Same VPS, same repo checkout as `deploy` (reused, not re-cloned). It
  # `needs: deploy` so the two never race on $SRC's git tree and the
  # tokenless git-auth dance lives in exactly one place (the deploy job
  # above). This job builds the 8 polyglot images from the freshened
  # checkout, stages the runtime dir, and brings the stack up.
  deploy-polyglot:
    needs: deploy
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy polyglot showcase via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          # appleboy's default command_timeout is 10m — a cold sequential
          # build of all 8 images (Maven go-offline, Cargo, the all-in-one
          # C-extension compile) blows past it mid-Spring. A partially-cached
          # build measured ~36m; 60m leaves headroom for a fully cold VPS
          # (after docker prune, no layer cache at all).
          command_timeout: 60m
          script: |
            set -euo pipefail
            SRC=/opt/apps/pg-reactive-src     # build context (the deploy job just reset this to master)
            POLY=/opt/apps/polyglot           # runtime dir: compose + .env + migration.sql

            test -d "$SRC/.git" || { echo "checkout $SRC missing — the deploy job must run first"; exit 1; }
            cd "$SRC"
            echo "building polyglot images at $(git rev-parse --short HEAD)"

            # Build all 8 images and tag them :latest so the template compose
            # resolves them from the local daemon. Cold .NET/Rust/Spring builds
            # are the slow part (~15-25 min).
            bash apps/polyglot/build-all.sh

            # Stage the runtime dir. compose + migration are synced every run;
            # .env is bootstrapped once and never clobbered so live secrets are
            # not rotated out from under the running stack.
            mkdir -p "$POLY"
            cp deploy/templates/polyglot-showcase/docker-compose.yml "$POLY/docker-compose.yml"
            cp deploy/templates/polyglot-showcase/migration.sql       "$POLY/migration.sql"

            # 5 shared secrets via the hardened generator (correct base64
            # SECRETS_ENCRYPTION_KEY, URL-safe password, idempotent). SITE_URL
            # is pinned to the showcase subdomain on first creation. Every
            # other compose var (image pins, WS_MAX_PER_IP, generator knobs)
            # has a default in the compose file, so no .env.example copy.
            SITE_URL=https://polyglot.pgstack.org ENV_FILE="$POLY/.env" bash scripts/bootstrap-env.sh
            # POLYGLOT_ENGINE_PASSWORD is the one required secret the generic
            # bootstrap does not manage (engines + migration share it). Add it
            # once; never rotate.
            if ! grep -q '^POLYGLOT_ENGINE_PASSWORD=.\+' "$POLY/.env"; then
              printf 'POLYGLOT_ENGINE_PASSWORD=%s\n' \
                "$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)" >> "$POLY/.env"
              chmod 600 "$POLY/.env"
            fi

            docker network create gateway 2>/dev/null || true
            cd "$POLY"
            # Clean slate each deploy: PG data is ephemeral (no volume), the
            # one-shot migration re-seeds the schema, and the six engines
            # reconnect on a fresh book — so the leaderboard reflects the
            # newly-built images, not stale cumulative state.
            docker compose --env-file .env down -v --remove-orphans || true
            docker compose --env-file .env up -d

            # Verify the dashboard's data path is live: poll pgstack /health
            # (the same endpoint its own healthcheck uses, so curl is present).
            echo "waiting for pgstack /health..."
            ok=
            for i in $(seq 1 24); do
              if docker exec polyglot-pgstack curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
                ok=1; break
              fi
              sleep 5
            done
            docker compose --env-file .env ps
            [ "$ok" = 1 ] || { echo "ERROR: pgstack /health never came up"; exit 1; }
            running=$(docker compose --env-file .env ps --services --status running 2>/dev/null \
                      | grep -c '^polyglot-engine-' || true)
            echo "engines running: ${running}/6"

            docker image prune -f
