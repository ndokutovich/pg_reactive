name: Deploy Examples to VPS

on:
  push:
    branches: [master]
    paths:
      - 'examples/**'
      - 'proxy-go/**'
      - 'ext/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            cd ~/pg_reactive/examples
            git -C .. remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git -C .. pull origin master
            docker network create gateway 2>/dev/null || true
            docker compose build --parallel
            docker compose up -d
            docker image prune -f
