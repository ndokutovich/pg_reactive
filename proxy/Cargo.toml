[package]
name = "pgstack-proxy"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket (axum's built-in ws uses tungstenite internally)
futures-util = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# raw_value: batch operation bodies are carried as raw JSON text so {{opId.field}}
# templates are resolved against the exact bytes (mirrors Go's json.RawMessage).
serde_json = { version = "1", features = ["raw_value"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
subtle = "2"
# OS CSPRNG for security tokens. We use getrandom directly rather than rand to
# avoid the RUSTSEC "rand is unsound with a custom logger using rand::rng()"
# advisory and to read OS entropy explicitly for every token.
getrandom = "0.3"
base64ct = { version = "1", features = ["alloc"] }
sha2 = "0.10"

# HTTP client (OAuth provider token exchange; webhook delivery)
reqwest = { version = "0.12", features = ["json"] }

# At-rest secret encryption (webhook signing secrets): AES-256-GCM. Mirrors the
# Go proxy's secrets.Box wire format byte-for-byte.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# HMAC-SHA256 webhook payload signing (sha2 already in tree).
hmac = "0.12"
# Webhook SSRF guard: IANA-reserved CIDR membership tests (mirror Go ipv4/ipv6Reserved).
ipnet = "2"

# URL parsing (webhook target validation + general)
url = "2"
urlencoding = "2"

# UUID parsing/validation (+ v4 for the anonymous-signin random sub)
uuid = { version = "1", features = ["v4"] }

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"], default-features = false }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
