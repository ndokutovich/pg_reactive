[package]
name = "pgstack-proxy"
version = "0.1.1"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket (axum's built-in ws uses tungstenite internally)
futures-util = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
subtle = "2"
rand = "0.9"
base64ct = { version = "1", features = ["alloc"] }
sha2 = "0.10"

# HTTP client (OAuth provider token exchange)
reqwest = { version = "0.12", features = ["json"] }

# URL parsing
urlencoding = "2"

# UUID parsing/validation
uuid = "1"

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"], default-features = false }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
