<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polyglot Matching Engines — pgstack</title>
<link rel="icon" href="favicon.svg">
<script src="config.js"></script>
<style>
  :root {
    --bg:        #0d1117;
    --panel:     #161b22;
    --border:    #30363d;
    --text:      #c9d1d9;
    --muted:     #8b949e;
    --accent:    #58a6ff;
    --bid:       #3fb950;
    --ask:       #f85149;
    --warn:      #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 13px ui-monospace, "SF Mono", Consolas, monospace;
  }
  h1 { color: var(--accent); margin: 0; font-size: 18px; }
  h2 { color: var(--muted); font-size: 11px; text-transform: uppercase; margin: 0 0 8px; letter-spacing: 0.05em; }
  header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
    padding: 12px 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px;
  }
  .badge {
    display: inline-block; padding: 2px 8px;
    background: var(--border); color: var(--text);
    border-radius: 4px; font-size: 11px;
  }
  button {
    background: var(--accent); color: #0d1117; border: 0;
    padding: 6px 14px; border-radius: 6px; font: inherit;
    font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  .form { display: flex; gap: 6px; align-items: center; }
  .form input, .form select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 4px; font: inherit; width: 80px;
  }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 16px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; min-height: 100px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
  td.side-buy  { color: var(--bid); }
  td.side-sell { color: var(--ask); }
  .engine-grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(3, 1fr);
  }
  .engine-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .engine-panel h3 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
  .engine-panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .engine-panel .fills { max-height: 140px; overflow: auto; }
  .latency-bar {
    height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
    margin: 4px 0;
  }
  .latency-bar > div { background: var(--warn); height: 100%; transition: width 0.3s; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ask); margin-right: 4px;
  }
  .status-dot.connected { background: var(--bid); }
  .stats-row { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  .stats-row strong { color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>Polyglot Matching Engines</h1>
  <span class="badge">BTC-USD</span>
  <span class="badge" id="conn-badge"><span class="status-dot" id="status-dot"></span><span id="status-text">connecting</span></span>

  <div class="form" style="margin-left:auto;">
    <select id="form-side"><option value="buy">buy</option><option value="sell">sell</option></select>
    <select id="form-type"><option value="limit">limit</option><option value="market">market</option></select>
    <input id="form-price" type="number" value="50000" step="1">
    <input id="form-qty"   type="number" value="0.5"   step="0.1">
    <button id="form-send">Send order</button>
  </div>
</header>

<div class="grid">
  <div class="panel">
    <h2>Aggregated top-of-book (all engines combined)</h2>
    <table>
      <thead><tr><th>Side</th><th>Price</th><th>Total qty</th><th>Orders</th></tr></thead>
      <tbody id="top-of-book"></tbody>
    </table>
  </div>
  <div class="panel">
    <h2>Engine performance summary</h2>
    <table>
      <thead><tr><th>Engine</th><th>Orders</th><th>Matches</th><th>Volume</th><th>Avg μs</th><th>P99 μs</th></tr></thead>
      <tbody id="perf-summary"></tbody>
    </table>
  </div>
</div>

<div class="engine-grid" id="engines">
  <!-- 6 panels generated by JS -->
</div>

<script>
const ENGINES = ['go','spring','fastapi','rust','dotnet','node'];

const enginesEl = document.getElementById('engines');
ENGINES.forEach(function(eng) {
  enginesEl.insertAdjacentHTML('beforeend',
    '<div class="engine-panel" id="panel-' + eng + '">' +
      '<h3>' + eng + '</h3>' +
      '<div class="sub" id="sub-' + eng + '">no data yet</div>' +
      '<div class="latency-bar"><div id="lat-bar-' + eng + '" style="width:0%"></div></div>' +
      '<h2>Top of book</h2>' +
      '<table><thead><tr><th>Side</th><th>Price</th><th>Qty</th></tr></thead>' +
        '<tbody id="book-' + eng + '"></tbody></table>' +
      '<h2 style="margin-top:8px;">Recent fills</h2>' +
      '<div class="fills"><table><thead><tr><th>Side</th><th>Price</th><th>Qty</th><th>μs</th></tr></thead>' +
        '<tbody id="fills-' + eng + '"></tbody></table></div>' +
    '</div>'
  );
});

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
let connected = 0;
function markConn(on) {
  connected += on ? 1 : -1;
  if (connected > 0) {
    statusDot.classList.add('connected');
    statusText.textContent = 'live';
  } else {
    statusDot.classList.remove('connected');
    statusText.textContent = 'disconnected';
  }
}

function renderTopOfBook(rows) {
  const tbody = document.getElementById('top-of-book');
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  rows.forEach(function(r) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="side-' + r.side + '">' + r.side + '</td>' +
                   '<td>' + Number(r.price).toFixed(2) + '</td>' +
                   '<td>' + Number(r.total_qty).toFixed(4) + '</td>' +
                   '<td>' + r.order_count + '</td>';
    tbody.appendChild(tr);
  });
}

function renderPerfSummary(rows) {
  const tbody = document.getElementById('perf-summary');
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  let maxP99 = 1;
  rows.forEach(function(r) { if (r.p99_latency_us > maxP99) maxP99 = r.p99_latency_us; });
  rows.forEach(function(r) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td style="text-align:left">' + r.engine + '</td>' +
                   '<td>' + r.total_orders + '</td>' +
                   '<td>' + r.total_matches + '</td>' +
                   '<td>' + Number(r.total_volume).toFixed(3) + '</td>' +
                   '<td>' + Number(r.avg_latency_us).toFixed(1) + '</td>' +
                   '<td>' + r.p99_latency_us + '</td>';
    tbody.appendChild(tr);

    const sub = document.getElementById('sub-' + r.engine);
    if (sub) {
      sub.textContent = r.total_orders + ' orders · ' + r.total_matches + ' matches · ' +
                        Number(r.total_volume).toFixed(3) + ' vol';
    }
    const bar = document.getElementById('lat-bar-' + r.engine);
    if (bar) bar.style.width = Math.min(100, (r.p99_latency_us / maxP99) * 100) + '%';
  });
}

function renderEngineBook(engine, rows) {
  const tbody = document.getElementById('book-' + engine);
  if (!tbody) return;
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  rows.forEach(function(r) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="side-' + r.side + '">' + r.side + '</td>' +
                   '<td>' + Number(r.price).toFixed(2) + '</td>' +
                   '<td>' + Number(r.total_qty).toFixed(4) + '</td>';
    tbody.appendChild(tr);
  });
}

function renderEngineFills(engine, rows) {
  const tbody = document.getElementById('fills-' + engine);
  if (!tbody) return;
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  rows.slice(0, 12).forEach(function(r) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="side-' + r.taker_side + '">' + r.taker_side + '</td>' +
                   '<td>' + Number(r.fill_price).toFixed(2) + '</td>' +
                   '<td>' + Number(r.matched_qty).toFixed(4) + '</td>' +
                   '<td>' + r.latency_us + '</td>';
    tbody.appendChild(tr);
  });
}

// ── Live-query state ──
const state = {
  topOfBook:    new Map(),         // (side,price) → row
  perfSummary:  new Map(),         // engine → row
  engineBook:   new Map(ENGINES.map(function(e){return [e, new Map()];})),
  engineFills:  new Map(ENGINES.map(function(e){return [e, []];})),
};

function deltaApply(key, msg, mapStore, keyFn) {
  (msg.deleted  || []).forEach(function(r) { mapStore.delete(keyFn(r)); });
  (msg.inserted || []).forEach(function(r) { mapStore.set(keyFn(r), r); });
}

function rebuildPerfRows() {
  const out = [];
  state.perfSummary.forEach(function(v) { out.push(v); });
  return out.sort(function(a,b){ return a.engine.localeCompare(b.engine); });
}

function rebuildTopOfBook() {
  const out = [];
  state.topOfBook.forEach(function(v) { out.push(v); });
  return out.sort(function(a,b) {
    if (a.side !== b.side) return a.side.localeCompare(b.side);
    return a.side === 'buy' ? (b.price - a.price) : (a.price - b.price);
  });
}

function rebuildEngineBook(engine) {
  const out = [];
  state.engineBook.get(engine).forEach(function(v) { out.push(v); });
  return out.sort(function(a,b) {
    if (a.side !== b.side) return a.side.localeCompare(b.side);
    return a.side === 'buy' ? (b.price - a.price) : (a.price - b.price);
  });
}

function openSubscription(queryId, onSnapshot, onDelta) {
  const ws = new WebSocket(PGR.wsBase + '/' + queryId);
  let firstDelta = true;
  ws.addEventListener('open',  function() { markConn(true); });
  ws.addEventListener('close', function() { markConn(false); setTimeout(function(){ openSubscription(queryId, onSnapshot, onDelta); }, 2000); });
  ws.addEventListener('error', function() {});
  ws.addEventListener('message', function(e) {
    let msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (msg.type) return;          // ignore subscribed/overflow/etc
    const inserted = msg.inserted || [];
    if (firstDelta) {
      firstDelta = false;
      onSnapshot(inserted);
    } else {
      onDelta(msg);
    }
  });
  return ws;
}

PGR.signInAnonymously().catch(function(){}).then(function() {
  // Aggregated top-of-book
  openSubscription('top_of_book_BTCUSD',
    function(rows) {
      state.topOfBook.clear();
      rows.forEach(function(r) { state.topOfBook.set(r.side + '|' + r.price, r); });
      renderTopOfBook(rebuildTopOfBook());
    },
    function(msg) {
      deltaApply('top', msg, state.topOfBook, function(r){ return r.side + '|' + r.price; });
      renderTopOfBook(rebuildTopOfBook());
    }
  );

  // Perf summary
  openSubscription('engine_perf_summary',
    function(rows) {
      state.perfSummary.clear();
      rows.forEach(function(r) { state.perfSummary.set(r.engine, r); });
      renderPerfSummary(rebuildPerfRows());
    },
    function(msg) {
      deltaApply('perf', msg, state.perfSummary, function(r){ return r.engine; });
      renderPerfSummary(rebuildPerfRows());
    }
  );

  // Per-engine book + fills
  ENGINES.forEach(function(eng) {
    openSubscription('engine_book_' + eng + '_BTCUSD',
      function(rows) {
        const bm = state.engineBook.get(eng); bm.clear();
        rows.forEach(function(r) { bm.set(r.side + '|' + r.price, r); });
        renderEngineBook(eng, rebuildEngineBook(eng));
      },
      function(msg) {
        deltaApply('book', msg, state.engineBook.get(eng), function(r){ return r.side + '|' + r.price; });
        renderEngineBook(eng, rebuildEngineBook(eng));
      }
    );
    openSubscription('recent_fills_' + eng,
      function(rows) {
        state.engineFills.set(eng, rows.slice());
        renderEngineFills(eng, state.engineFills.get(eng));
      },
      function(msg) {
        const cur = state.engineFills.get(eng);
        const next = [].concat(msg.inserted || [], cur).slice(0, 30);
        state.engineFills.set(eng, next);
        renderEngineFills(eng, next);
      }
    );
  });
});

// Manual order submission via RPC
document.getElementById('form-send').addEventListener('click', async function() {
  const side  = document.getElementById('form-side').value;
  const type  = document.getElementById('form-type').value;
  const price = parseFloat(document.getElementById('form-price').value);
  const qty   = parseFloat(document.getElementById('form-qty').value);
  try {
    const res = await fetch(location.origin + '/rest/v1/rpc/place_order', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': PGR.anonKey,
        'Authorization': 'Bearer ' + PGR.token
      },
      body: JSON.stringify({
        p_symbol: 'BTC-USD',
        p_side:   side,
        p_type:   type,
        p_price:  type === 'limit' ? price : null,
        p_qty:    qty
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(function(){return {};});
      alert('place_order failed: ' + (err.error || err.message || res.status));
    }
  } catch (e) {
    alert('place_order error: ' + e.message);
  }
});
</script>
</body>
</html>
