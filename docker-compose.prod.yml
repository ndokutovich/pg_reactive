# Production docker-compose for pgStack.
# Uses pre-built images from GHCR, persistent volumes, resource limits.
#
# Usage (STANDALONE — do NOT combine with docker-compose.yml):
#   cp .env.example .env   # fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (see .env.example):
#   POSTGRES_PASSWORD, JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY

services:
  db:
    image: ghcr.io/ndokutovich/pgstack-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (random 32+ bytes)}
      # docker/20-authenticator-login.sh (in the pgstack-postgres image) uses
      # this to make the powerless `authenticator` role LOGIN-able, so the proxy
      # connects as a non-superuser (gemini audit P2). MUST match the proxy's
      # DATABASE_URL below. Applied at first init only — to rotate on an existing
      # volume, ALTER ROLE authenticator PASSWORD manually and update both here.
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD required (random 32+ bytes, URL-safe)}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    command: >
      postgres
        -c shared_preload_libraries=pg_reactive
        -c pg_reactive.max_subscriptions=1024
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c log_min_messages=warning
        -c log_statement=none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  proxy:
    image: ghcr.io/ndokutovich/pgstack-proxy:latest
    restart: unless-stopped
    environment:
      # Connect as the powerless `authenticator` role (NOT the superuser): the
      # proxy SET ROLEs per request so a compromise cannot bypass RLS by default,
      # COPY ... FROM PROGRAM, DROP DATABASE, or read pg_authid (gemini audit P2).
      DATABASE_URL: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD required (random 32+ bytes, URL-safe)}@db:5432/${POSTGRES_DB:-app}
      LISTEN_ADDR: "0.0.0.0:8080"
      # Production marker: the Go proxy's Validate() refuses to start when
      # any of these are left as publicly-known dev defaults, when
      # ENABLE_SQL_ENDPOINT is true, or when REQUIRE_AUTHENTICATED_WS is
      # false. ${VAR:?...} additionally fail-fasts at the compose level.
      PGSTACK_ENV: production
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET required (32+ chars, not dev-only)}
      ANON_KEY:          ${ANON_KEY:?ANON_KEY required (random 32+ bytes)}
      SERVICE_ROLE_KEY:  ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY required (random 32+ bytes)}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY required (32 bytes base64)}
      SITE_URL: ${SITE_URL:?SITE_URL required for OAuth callbacks}
      REQUIRE_AUTHENTICATED_WS: "true"
      # OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # SMTP for email verification (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pgstack.local}
      # Tuning
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-10000}
      ACCESS_TOKEN_EXPIRY_SECS: ${ACCESS_TOKEN_EXPIRY_SECS:-3600}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-30}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-1048576}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ENABLE_SQL_ENDPOINT: "false"
      PUBLIC_DIR: ${PUBLIC_DIR:-/public}
      # HTTP server
      READ_TIMEOUT: ${READ_TIMEOUT:-30}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-60}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-120}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15}
      GZIP_LEVEL: ${GZIP_LEVEL:-5}
      # PG pool
      PG_POOL_MAX_CONNS: ${PG_POOL_MAX_CONNS:-50}
      PG_POOL_MIN_CONNS: ${PG_POOL_MIN_CONNS:-5}
      PG_POOL_MAX_CONN_IDLE_TIME: ${PG_POOL_MAX_CONN_IDLE_TIME:-300}
      # TLS (default off — use reverse proxy)
      TLS_MODE: ${TLS_MODE:-off}
      TLS_DOMAINS: ${TLS_DOMAINS:-}
      TLS_CERT_DIR: ${TLS_CERT_DIR:-/data/certs}
      TLS_ACME_EMAIL: ${TLS_ACME_EMAIL:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      HTTPS_ADDR: ${HTTPS_ADDR:-:443}
      HTTP_ADDR: ${HTTP_ADDR:-:80}
    volumes:
      - ./public:/public:ro
      - certs:/data/certs
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
      # Uncomment for TLS_MODE=auto:
      # - "443:443"
      # - "80:80"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  certs:
    driver: local
