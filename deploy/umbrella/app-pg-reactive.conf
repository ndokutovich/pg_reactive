# reactive.pgstack.org — umbrella nginx routing for the pg_reactive public
# examples site. Tracked in this repo (deploy/umbrella/) and copied onto
# /opt/proxy/nginx/conf.d/ by .github/workflows/deploy.yml so the route
# cannot silently rot away from a separate ops repo's checkout — the gap
# this file closes is exactly the one diagnosed in round 34: umbrella had
# no server_name match for reactive.pgstack.org, so every request fell to
# the default server and served a months-stale baked-in index.html. With
# this block in place every request reaches examples-web (alias pgr-web)
# and the inner nginx handles /ws/, /api/, /auth/, /rest/ sub-routing.

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name reactive.pgstack.org;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location / {
        set $pg_reactive_upstream http://pgr-web:8000;
        proxy_pass $pg_reactive_upstream;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
