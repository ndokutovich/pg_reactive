# polyglot.pgstack.org — umbrella nginx routing for the polyglot
# matching-engine showcase. Tracked here so deploy.yml installs/reloads
# it automatically; cousin to deploy/umbrella/app-pg-reactive.conf.

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name polyglot.pgstack.org;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location / {
        set $polyglot_web http://polyglot-web:80;
        proxy_pass $polyglot_web;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location ~ ^/(auth|rest|ws|api|functions)/ {
        set $polyglot_pgstack http://polyglot-pgstack:8080;
        proxy_pass $polyglot_pgstack;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
