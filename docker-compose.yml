services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      POSTGRES_DB: pg_reactive_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      # docker/20-authenticator-login.sh ALTERs the two powerless proxy roles
      # LOGIN with these passwords at init: `authenticator` (data plane, anon/
      # authenticated) and `authenticator_admin` (admin plane, service_role) —
      # split so a data-plane compromise can't reach service_role (finding 6).
      # Dev values only; prod injects real ones.
      AUTHENTICATOR_PASSWORD: authenticator-dev-pw
      AUTHENTICATOR_ADMIN_PASSWORD: authenticator-admin-dev-pw
    ports:
      - "127.0.0.1:${PG_PORT:-15432}:5432"
    command: >
      postgres
        -c shared_preload_libraries=pg_reactive
        -c log_min_messages=warning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_reactive_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      # The dev image COMPILES the extension in its entrypoint before
      # PostgreSQL starts (Dockerfile.dev COPYs source, entrypoint runs make).
      # A cold compile + initdb + the pgstack bootstrap can take ~40s, which
      # exceeds retries*interval (~20s) and falsely marked the container
      # unhealthy. start_period suppresses unhealthy during the boot window.
      start_period: 90s
    tmpfs:
      - /var/lib/postgresql/data

  proxy-go:
    build:
      context: .
      dockerfile: proxy-go/Dockerfile
    environment:
      # The proxy connects as the powerless `authenticator` role (LOGIN
      # NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT), NOT the superuser.
      # It SET ROLEs per request: the data plane SET LOCAL ROLEs anon/
      # authenticated/service_role (RLS enforced), and the admin pool SET
      # ROLEs service_role for trusted backend ops. A compromised proxy
      # therefore cannot bypass RLS by default, COPY ... FROM PROGRAM, DROP
      # DATABASE, or read pg_authid (gemini audit P2). Dev password set by
      # docker/init.sql; production injects a real one via bootstrap-env.sh.
      DATABASE_URL: postgres://authenticator:authenticator-dev-pw@db:5432/pg_reactive_test
      # Admin pool: separate login role (authenticator_admin, member of
      # service_role) so a data-plane compromise can't escalate (finding 6).
      ADMIN_DATABASE_URL: postgres://authenticator_admin:authenticator-admin-dev-pw@db:5432/pg_reactive_test
      LISTEN_ADDR: "0.0.0.0:8080"
      # Dev posture: the proxy defaults to PGSTACK_ENV=production (fail-secure),
      # so this base — with dev-only secrets and ENABLE_SQL_ENDPOINT=true — must
      # opt into development explicitly or it refuses to boot. Override on the
      # host to run the dev compose under the strict validator.
      PGSTACK_ENV: ${PGSTACK_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production}
      ANON_KEY: ${ANON_KEY:-dev-only-anon-key-do-not-use-in-production}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-dev-only-service-role-key-do-not-use-in-production}
      ENABLE_SQL_ENDPOINT: "true"
      # REQUIRE_AUTHENTICATED_WS is propagated from the host env so CI
      # can flip it on for the adversarial-security suite without
      # editing compose (round 32 F2). Default in dev: empty (= false).
      REQUIRE_AUTHENTICATED_WS: ${REQUIRE_AUTHENTICATED_WS:-}
      # Propagated from the host so the email-verification security E2E can flip
      # it on without editing compose (mirrors REQUIRE_AUTHENTICATED_WS).
      # REQUIRE_EMAIL_VERIFICATION=true also requires SMTP_* (the proxy refuses to
      # boot otherwise); the test passes dummy values and injects tokens directly.
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      PUBLIC_DIR: /public
      # OAuth dev knobs (test placeholders). A provider is "enabled" once its
      # env is set; these let the authorize endpoints build redirects locally.
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-google-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-test-google-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-test-github-client}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-test-github-secret}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.example.auth}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-ABCDE12345}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-FGHIJ67890}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-test-ms-client}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-test-ms-secret}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-test-oidc-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-test-oidc-secret}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://accounts.google.com}
      # EDGE_RUNTIME_URL: http://edge-runtime:9000  # uncomment to enable Deno functions
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    volumes:
      - ./public:/public:ro
    depends_on:
      db:
        condition: service_healthy

  # Optional: Supabase edge-runtime for Deno-based edge functions.
  # Uncomment to enable, and also uncomment EDGE_RUNTIME_URL on proxy-go above.
  # edge-runtime:
  #   image: supabase/edge-runtime:v1.62.2
  #   environment:
  #     PGSTACK_DB_URL: postgres://postgres:postgres@db:5432/pg_reactive_test
  #   volumes:
  #     - ./supabase/functions:/functions:ro
  #   depends_on:
  #     db:
  #       condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      # Two powerless login roles, mirroring proxy-go: data plane (authenticator,
      # anon/authenticated) + admin plane (authenticator_admin, service_role). The
      # proxy runs two pools so a data-plane compromise can't reach service_role.
      DATABASE_URL: postgres://authenticator:authenticator-dev-pw@db:5432/pg_reactive_test
      ADMIN_DATABASE_URL: postgres://authenticator_admin:authenticator-admin-dev-pw@db:5432/pg_reactive_test
      # Defaults to production (fail-secure); dev opts into the relaxed posture so
      # verifyPoolRoles warns instead of aborting boot.
      PGSTACK_ENV: ${PGSTACK_ENV:-development}
      LISTEN_ADDR: "0.0.0.0:8080"
      RUST_LOG: pgstack_proxy=info,tower_http=info
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production}
      ANON_KEY: ${ANON_KEY:-dev-only-anon-key-do-not-use-in-production}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-dev-only-service-role-key-do-not-use-in-production}
      ENABLE_SQL_ENDPOINT: "true"
      # User static hosting (mirror proxy-go): serve ./public as the lowest-priority
      # SPA fallback. The image bakes /public; the bind mount overrides it in dev.
      PUBLIC_DIR: /public
      # OAuth dev knobs (same test placeholders as proxy-go) so the Rust
      # authorize endpoints build identical redirects for parity checks.
      SITE_URL: ${SITE_URL_RUST:-http://127.0.0.1:8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-google-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-test-google-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-test-github-client}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-test-github-secret}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.example.auth}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-ABCDE12345}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-FGHIJ67890}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-test-ms-client}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-test-ms-secret}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-test-oidc-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-test-oidc-secret}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://accounts.google.com}
    ports:
      - "127.0.0.1:${PROXY_RUST_PORT:-8081}:8080"
    volumes:
      - ./public:/public:ro
    depends_on:
      db:
        condition: service_healthy
