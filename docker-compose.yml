services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      POSTGRES_DB: pg_reactive_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    command: >
      postgres
        -c shared_preload_libraries=pg_reactive
        -c log_min_messages=warning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_reactive_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  proxy-go:
    build:
      context: .
      dockerfile: proxy-go/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pg_reactive_test
      LISTEN_ADDR: "0.0.0.0:8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production}
      ANON_KEY: ${ANON_KEY:-dev-only-anon-key-do-not-use-in-production}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-dev-only-service-role-key-do-not-use-in-production}
      ENABLE_SQL_ENDPOINT: "true"
      PUBLIC_DIR: /public
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./public:/public:ro
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pg_reactive_test
      LISTEN_ADDR: "0.0.0.0:8080"
      RUST_LOG: pgstack_proxy=info,tower_http=info
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production}
      ANON_KEY: ${ANON_KEY:-dev-only-anon-key-do-not-use-in-production}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-dev-only-service-role-key-do-not-use-in-production}
      ENABLE_SQL_ENDPOINT: "true"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
